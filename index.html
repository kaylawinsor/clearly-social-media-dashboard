/* ============ Design tokens ============ */
:root{
  /* Clearly · Sunny palette — light (cool crisp canvas, slate-forward; warmth lives only in small accents) */
  --page:#F2F5F6; --surface:#FFFFFF; --surface-alt:#F7FAFA;
  --ink:#2C3B42; --ink-2:#51646E; --muted:#7E8F96; --hairline:#E2E8E9;
  --slate-soft:#E9EEF1;
  --teal:#587987; --teal-deep:#44606C; --teal-soft:#E8EEF1;
  --coral:#E7805B; --coral-deep:#AC4E28; --coral-soft:#FAE4D9;
  --aqua:#71C0BC; --aqua-deep:#1F6E66; --aqua-soft:#DFF1EF;
  --golden:#F3BE3F; --golden-soft:#FBEDC8; --golden-deep:#8A6210;
  /* legacy aliases — interactive chrome routes through Slate Teal, warm accents through Coral */
  --brand:var(--teal); --brand-soft:var(--teal-soft); --brand-deep:var(--teal-deep);
  --pink:var(--coral); --pink-soft:var(--coral-soft); --pink-deep:var(--coral-deep);
  --sage:var(--teal); --sage-soft:var(--teal-soft); --blush:var(--coral-soft); --terracotta:var(--coral);
  /* status — brand-family, never stock traffic-light: good=aqua, warning=golden,
     serious=coral, critical=deep coral-rust. Icon + label always carry the meaning. */
  --good:#2E8C82; --warning:#D9A322; --serious:#CF6B3E; --critical:#BC4A26;
  --good-soft:#DFF1EF; --warning-soft:#FBEDC8; --serious-soft:#FAE4D9; --critical-soft:#F7DCD0;
  --good-deep:#1F6E66; --warning-deep:#8A6210; --serious-deep:#AC4E28; --critical-deep:#8F3413;
  --info-soft:#EAEDEF; --info-deep:#556067;
  --tip-bg:#22333B; --tip-ink:#F0E6DB;
  --logo-ink:#587987;
  --accent-btn:var(--golden); --accent-btn-hover:#E9AF2B; --accent-btn-ink:#2C3B42;
  --radius:16px; --radius-s:12px;
  --shadow:0 12px 40px -28px rgba(0,0,0,.35);
  --sans:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:'Plus Jakarta Sans','Inter',system-ui,sans-serif;
  --serif:var(--display);
  --sidebar-w:236px;
}
/* ---- Palette ordering contract (load-bearing) ----
   Blocks must appear in exactly this order so palette × theme compose:
     1. :root                                  (Clearly light — baseline)
     2. :root[data-palette="blush"]            (Blush light — ties with #3 at (0,2,0); being EARLIER, it loses in dark)
     3. :root[data-theme="dark"]               (Clearly dark)
     4. :root[data-palette="blush"][data-theme="dark"]  (Blush dark — (0,3,0) wins everything)
   Moving block 2 after block 3 silently corrupts Blush+dark. */
:root[data-palette="blush"]{
  /* Clearly · Blush palette — light (rosy canvas; lilac interactive, rose warm accent, mint good, apricot golden).
     Chart accents validated (dataviz six checks): #7A55B0 #E7698B #DA9A1F #22997B */
  --page:#F7F2F5; --surface:#FFFFFF; --surface-alt:#FBF6F9;
  --ink:#3A2C3C; --ink-2:#655468; --muted:#928095; --hairline:#ECE2EC;
  --slate-soft:#F0E6F0;
  --teal:#7A55B0; --teal-deep:#5E3F8F; --teal-soft:#EFE8F8;
  --coral:#E7698B; --coral-deep:#B03A5E; --coral-soft:#FBE0E8;
  --aqua:#22997B; --aqua-deep:#1A7259; --aqua-soft:#DCF2EA;
  --golden:#E8A33B; --golden-soft:#FBEDD6; --golden-deep:#8A5A10;
  --good:#279B77; --warning:#CE9118; --serious:#CF5573; --critical:#B3264C;
  --good-soft:#DCF2EA; --warning-soft:#F9ECCF; --serious-soft:#FADEE5; --critical-soft:#F6D5DE;
  --good-deep:#1A7259; --warning-deep:#8A5F0E; --serious-deep:#A32C4E; --critical-deep:#8C1039;
  --info-soft:#F0EAF2; --info-deep:#5F5566;
  --tip-bg:#3A2C3C; --tip-ink:#F7ECF2;
  --logo-ink:#7A55B0;
  --accent-btn:#F5A5BC; --accent-btn-hover:#F08FAC; --accent-btn-ink:#3A2C3C;
}
:root[data-theme="dark"]{
  /* Clearly · Sunny palette — dark (re-stepped, not inverted) */
  --page:#22333B; --surface:#2C3B42; --surface-alt:#293840;
  --ink:#F0E6DB; --ink-2:#C0CDD1; --muted:#9FB2B8; --hairline:#3A4C54;
  --slate-soft:#31414B;
  --teal:#9DBECB; --teal-deep:#C4D8E0; --teal-soft:#33454E;
  --coral:#E7805B; --coral-deep:#F0A283; --coral-soft:#463229;
  --aqua:#71C0BC; --aqua-deep:#9BD9D4; --aqua-soft:#28423E;
  --golden:#F3BE3F; --golden-soft:#463D22; --golden-deep:#EFCE8C;
  --good:#71C0BC; --warning:#F3BE3F; --serious:#E7805B; --critical:#E76A48;
  --good-soft:#28423E; --warning-soft:#463D22; --serious-soft:#463229; --critical-soft:#48281E;
  --good-deep:#9BD9D4; --warning-deep:#EFCE8C; --serious-deep:#F0A283; --critical-deep:#F49B7E;
  --info-soft:#33444C; --info-deep:#C0CDD1;
  --logo-ink:#F0E6DB;
  --shadow:0 12px 40px -28px rgba(0,0,0,.65);
}
:root[data-palette="blush"][data-theme="dark"]{
  /* Clearly · Blush palette — dark (re-stepped plum, not inverted).
     Chart accents validated (dataviz six checks, surface #302336): #9268C9 #D6537B #C08018 #279B77 */
  --page:#241A28; --surface:#302336; --surface-alt:#2C2032;
  --ink:#F3E9F0; --ink-2:#CDBBD0; --muted:#9E8AA4; --hairline:#453549;
  --slate-soft:#3B2D42;
  --teal:#9268C9; --teal-deep:#C4A8E8; --teal-soft:#3E3153;
  --coral:#D6537B; --coral-deep:#F0A0BA; --coral-soft:#4A2C38;
  --aqua:#279B77; --aqua-deep:#8FDCC2; --aqua-soft:#26443A;
  --golden:#C08018; --golden-soft:#46381F; --golden-deep:#EFC98A;
  --good:#3FBF95; --warning:#E5B33C; --serious:#E76A8B; --critical:#EF4F72;
  --good-soft:#274538; --warning-soft:#453A20; --serious-soft:#4A2A35; --critical-soft:#4E1F2C;
  --good-deep:#96E0C6; --warning-deep:#F0D194; --serious-deep:#F2A2B8; --critical-deep:#F79FB2;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5}
/* No layout may ever widen the page itself — tables scroll inside .tablewrap.
   iOS in particular lets you pan to fixed/absolute elements past the right edge. */
html,body{overflow-x:clip}
img,svg{max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--sage);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:-9999px;top:8px;background:var(--surface);padding:8px 14px;border-radius:8px;box-shadow:var(--shadow);z-index:99}
.skip:focus{left:8px}
::selection{background:var(--sage-soft)}

/* ============ App frame ============ */
.app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);flex:0 0 auto;background:var(--surface);border-right:1px solid var(--hairline);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px 24px;display:flex;flex-direction:column;gap:4px;z-index:40}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
main{padding:20px clamp(14px,3vw,32px) 64px;max-width:1440px;width:100%;margin:0 auto}
main:focus{outline:none}

/* Sidebar */
.wordmark{display:block;font-family:var(--display);font-size:21px;font-weight:800;
  letter-spacing:-.02em;padding:2px 10px 14px;line-height:1.2;color:var(--teal)}
.wordmark .wm-row{display:flex;align-items:center;gap:8px}
.wordmark svg{flex:0 0 auto}
.wordmark .wm-sub{display:block;font-family:var(--sans);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-top:5px}
.navgroup{margin-top:14px}
.navgroup h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:0 0 6px;padding:0 10px;font-weight:600}
.navgroup ul{list-style:none;margin:0;padding:0}
.navbtn{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:9px;color:var(--ink-2);font-size:13.5px}
.navbtn svg{flex:0 0 auto;opacity:.75}
.navbtn:hover{background:var(--surface-alt);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--slate-soft);color:var(--ink);font-weight:600}
.navbtn[aria-current="page"] svg{opacity:1;color:var(--teal)}
#scrim{display:none}

/* Top bar */
#topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px clamp(14px,3vw,32px);
  background:color-mix(in srgb, var(--page) 88%, transparent);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:30}
@supports not (background:color-mix(in srgb,red,blue)){#topbar{background:var(--page)}}
.tb-brand{display:flex;align-items:center;gap:8px;min-width:0}
.tb-brand .brandname{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.02em;min-width:40px}
.tb-greet{color:var(--ink-2);font-size:12.5px;margin-right:auto;padding-left:2px}
.tb-greet strong{color:var(--ink);font-weight:600}
.tb-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;border:1px solid var(--teal);
  background:var(--surface);color:var(--teal-deep);font-size:12.5px;font-weight:600;transition:border-color .15s,color .15s,background .15s}
.btn:hover{background:var(--teal-soft)}
.btn-primary{background:var(--accent-btn);border-color:var(--accent-btn);color:var(--accent-btn-ink)}
.btn-primary:hover{background:var(--accent-btn-hover);border-color:var(--accent-btn-hover);color:var(--accent-btn-ink)}
.btn-danger:hover{border-color:var(--critical);color:var(--critical-deep);background:var(--critical-soft)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--teal-soft)}
#menuToggle{display:none}

/* ============ Cards & grid ============ */
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{grid-column:span 12;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c3{grid-column:span 3}
.card-h{--hacc-deep:var(--teal-deep);--hacc-soft:var(--teal-soft);
  display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--surface-alt);border-bottom:1px solid var(--hairline)}
.card-h h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--ink);font-weight:700}
.card-h svg{color:var(--hacc-deep);opacity:1;width:25px;height:25px;padding:5px;box-sizing:border-box;
  background:var(--hacc-soft);border-radius:8px;flex:0 0 auto}
.card-h .h-aux{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.card-h.acc-coral{--hacc-deep:var(--coral-deep);--hacc-soft:var(--coral-soft)}
.card-h.acc-aqua{--hacc-deep:var(--aqua-deep);--hacc-soft:var(--aqua-soft)}
.card-h.acc-golden{--hacc-deep:var(--golden-deep);--hacc-soft:var(--golden-soft)}
/* KPI tile accents — decorative top bar + label ink, never a data encoding */
.acc-t-coral{border-top:3px solid var(--coral)}.acc-t-coral .t-label{color:var(--coral-deep)}
.acc-t-teal{border-top:3px solid var(--teal)}.acc-t-teal .t-label{color:var(--teal-deep)}
.acc-t-aqua{border-top:3px solid var(--aqua)}.acc-t-aqua .t-label{color:var(--aqua-deep)}
.acc-t-golden{border-top:3px solid var(--golden)}.acc-t-golden .t-label{color:var(--golden-deep)}
.gaugewrap.hero-grad{background:linear-gradient(180deg,var(--slate-soft),transparent 62%)}
.card-b{padding:16px}
.card-b.tight{padding:10px 12px}
.card-b.flush{padding:0}

/* Reporting-period bar */
.periodbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.periodbar .seg{display:inline-flex;border:1px solid var(--teal);border-radius:999px;overflow:hidden;background:var(--surface)}
.periodbar .seg button{padding:6px 14px;font-size:12.5px;font-weight:600;color:var(--teal-deep)}
.periodbar .seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.periodbar .seg button:not([aria-pressed="true"]):hover{background:var(--teal-soft)}
.periodbar .plabel{min-width:112px;text-align:center;font-family:var(--display);font-weight:700;letter-spacing:-.01em}
.periodbar .pnote{font-size:11.5px;color:var(--muted);font-style:italic}
@media (max-width:700px){.periodbar .pnote{display:none}}

/* View header */
.viewhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:6px 0 18px}
.viewhead h1{font-family:var(--display);font-weight:800;letter-spacing:-.02em;font-size:clamp(22px,3vw,28px);margin:0}
.viewhead p{margin:0;color:var(--ink-2);font-size:13px}
.viewhead .vh-aux{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ============ Stat tiles ============ */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.tile{background:var(--surface-alt);border:1px solid var(--hairline);border-radius:var(--radius-s);padding:11px 13px;min-width:0}
.tile .t-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--teal);font-weight:700;display:flex;align-items:center;gap:5px}
.tile .t-value{font-family:var(--display);font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:3px;line-height:1.15;white-space:nowrap}
.tile .t-value .unit{font-size:13px;color:var(--ink-2);font-weight:600}
.tile .t-sub{font-size:11.5px;color:var(--ink-2);margin-top:3px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.tile.hero-tile{background:var(--surface)}

/* Benchmark badge */
.bench{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;white-space:nowrap}
.bench.up{background:var(--aqua-soft);color:var(--aqua-deep)}
.bench.down{background:var(--coral-soft);color:var(--coral-deep)}
.bench.flat{background:var(--info-soft);color:var(--info-deep)}

/* ============ Status chips ============ */
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip svg{flex:0 0 auto}
.chip.good{background:var(--good-soft);color:var(--good-deep)}
.chip.warning{background:var(--warning-soft);color:var(--warning-deep)}
.chip.serious{background:var(--serious-soft);color:var(--serious-deep)}
.chip.critical{background:var(--critical-soft);color:var(--critical-deep)}
.chip.neutral{background:var(--info-soft);color:var(--info-deep)}
.chip.sagey{background:var(--teal-soft);color:var(--teal-deep)}
/* Status dropdown pills — same look as chips, but an obvious select */
.chipsel{cursor:pointer;padding-right:7px}
.chipsel select.statussel{appearance:none;-webkit-appearance:none;-moz-appearance:none;background:transparent;border:none;
  font:inherit;font-weight:600;color:inherit;padding:0;margin:0;cursor:pointer;text-overflow:ellipsis;min-width:0;max-width:100%}
.chipsel{max-width:100%;overflow:hidden}
.chipsel select.statussel:focus{outline:none}
.chipsel:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.chipsel svg.chev{opacity:.65;margin-left:-2px}
.chipsel:hover svg.chev{opacity:1}

/* Auth strip */
.authrow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.authcell{flex:1 1 110px;background:var(--surface-alt);border:1px solid var(--hairline);border-radius:var(--radius-s);padding:10px 12px;min-width:104px}
.authcell .a-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:6px}

/* ============ Editable fields ============ */
.ed{font:inherit;color:inherit;background:transparent;border:none;border-bottom:1px dashed transparent;
  padding:0 1px;margin:0;border-radius:0;min-width:2ch;max-width:100%;transition:border-color .12s;font-variant-numeric:inherit}
.ed:hover{border-bottom-color:var(--muted)}
/* Empty fields read as a fill-me-in box so buyers can spot where their data goes */
.ed.ed-empty{background:var(--slate-soft);border-bottom:1px dashed var(--muted);border-radius:6px 6px 2px 2px;padding:0 6px}
.ed:focus{outline:none;border-bottom:1px solid var(--sage);background:var(--sage-soft)}
.ed.ed-num{text-align:right;font-variant-numeric:tabular-nums}
.ed.ed-big{font-size:inherit;font-weight:inherit;text-align:left}
td .ed{width:100%}
.derived{color:var(--ink);font-variant-numeric:tabular-nums}
.dash{color:var(--muted)}
.hint-edit{font-size:11px;color:var(--muted);font-style:italic}

/* ============ Tables ============ */
.tablewrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
table.data th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--teal);font-weight:700;text-align:left;
  padding:9px 10px;border-bottom:1px solid var(--hairline);background:var(--surface-alt);white-space:nowrap}
table.data th.sortable{cursor:pointer;user-select:none}
table.data th.sortable:hover{color:var(--ink)}
table.data td{padding:8px 10px;border-bottom:1px solid var(--hairline);vertical-align:middle}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr:hover{background:var(--surface-alt)}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
/* Always visible (dimmed) — hover-only reveal made delete undiscoverable on
   touch, and never revealed at all outside <tr> contexts (ideas, milestones…). */
.rowdel,.rowedit{opacity:.5;color:var(--muted);padding:2px 5px;border-radius:6px;font-size:13px;line-height:1}
tr:hover .rowdel,.rowdel:focus-visible,.rowdel:hover,
tr:hover .rowedit,.rowedit:focus-visible,.rowedit:hover{opacity:1}
.rowdel:hover{color:var(--critical);background:var(--critical-soft)}
.rowedit:hover{color:var(--teal-deep);background:var(--teal-soft)}
/* Rows/cards that open an editor when tapped */
.rowlink{cursor:pointer}
.rowlink:hover{background:var(--surface-alt)}
.cal .day[data-action]{cursor:pointer}
.cal .day[data-action]:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.addrow{display:inline-flex;align-items:center;gap:6px;color:var(--brand-deep);font-weight:600;font-size:12.5px;padding:8px 4px}
.addrow:hover{text-decoration:underline}

/* ============ Charts ============ */
.chartbox{position:relative}
.spark path.line{fill:none;stroke:var(--coral);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark path.area{fill:var(--coral-soft);opacity:.6}
/* Gradient area fill — stop colors live here (var() is invalid in SVG presentation attributes)
   so they retint live on theme/palette switches; the inline fill:url() beats the fallback above */
.spark stop.gs0{stop-color:var(--coral);stop-opacity:.32}
.spark stop.gs1{stop-color:var(--coral);stop-opacity:.02}
.spark path.area[style]{opacity:1}
/* Mini charts (KPI tiles & home cards) */
.minispark,.minibars{display:block}
.tile .t-spark{margin-top:8px}
.minibars rect{cursor:default}
.spark text.direct{fill:var(--ink);font-size:11px;font-weight:700;font-family:var(--display)}
.spark line.grid{stroke:var(--hairline);stroke-width:1}
.spark text{fill:var(--muted);font-size:9.5px;font-family:var(--sans)}
.spark circle.pt{fill:var(--coral);stroke:var(--surface);stroke-width:2;opacity:0;pointer-events:none}
.spark circle.pt.on{opacity:1}
.spark line.cursor{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 3;opacity:0;pointer-events:none}
.spark line.cursor.on{opacity:1}
.tooltip{position:fixed;z-index:80;background:var(--tip-bg);color:var(--tip-ink);font-size:11.5px;padding:5px 9px;border-radius:7px;
  pointer-events:none;white-space:nowrap;box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 9px))}
/* Horizontal bar chart (single series, Coral, direct labels) */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:minmax(90px,190px) 1fr 64px;gap:10px;align-items:center;font-size:12.5px;border-radius:6px}
.hbar .hb-label{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .hb-track{display:block;height:14px}
.hbar .hb-fill{display:block;height:100%;background:var(--coral);border-radius:0 4px 4px 0;min-width:2px}
.hbar:hover .hb-fill{background:var(--coral-deep)}
.hbar .hb-val{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;text-align:right;font-family:var(--display);letter-spacing:-.01em}
.tooltip .tt-v{font-weight:700;font-variant-numeric:tabular-nums}
details.tablefall{margin-top:8px;font-size:12px}
details.tablefall summary{color:var(--muted);cursor:pointer;font-size:11.5px}
details.tablefall table{margin-top:6px}

/* Gauge */
.gaugewrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 2px}
.gauge text.gv{font-size:34px;font-weight:800;fill:var(--ink);font-family:var(--display);letter-spacing:-.02em}
.gauge text.gl{font-size:10px;fill:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-family:var(--sans)}
.gauge .track{stroke:var(--hairline)}
.risknote{font-size:12.5px;color:var(--ink-2);text-align:center;padding:0 14px 6px;line-height:1.45}
.risknote strong{color:var(--ink)}
.subscores{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;width:100%;padding:10px 16px 4px;border-top:1px solid var(--hairline);margin-top:4px}
.subscore{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--ink-2)}
.subscore b{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.meterbar{height:4px;border-radius:2px;background:var(--hairline);flex:1;margin:0 4px;overflow:hidden;min-width:20px}
.meterbar i{display:block;height:100%;border-radius:2px;background:var(--sage)}

/* Donut */
.donut .track{stroke:var(--hairline)}
.donut .val{stroke:var(--aqua)}
.donutrow{display:flex;align-items:center;gap:12px}
.donutmeta .d-big{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.donutmeta .d-sub{font-size:11.5px;color:var(--ink-2)}

/* ============ Alerts ============ */
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--hairline);font-size:13px}
.alerts li:last-child{border-bottom:none}
.alerts .a-ic{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin-top:1px}
.alerts .sev-critical .a-ic{background:var(--critical-soft);color:var(--critical-deep)}
.alerts .sev-serious .a-ic{background:var(--serious-soft);color:var(--serious-deep)}
.alerts .sev-warning .a-ic{background:var(--warning-soft);color:var(--warning-deep)}
.alerts .sev-info .a-ic{background:var(--info-soft);color:var(--info-deep)}
.alerts .a-txt{min-width:0}
.alerts .a-sev{font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-right:6px}
.alerts .sev-critical .a-sev{color:var(--critical-deep)}
.alerts .sev-serious .a-sev{color:var(--serious-deep)}
.alerts .sev-warning .a-sev{color:var(--warning-deep)}
.alerts .sev-info .a-sev{color:var(--info-deep)}
.allclear{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;color:var(--ink-2);text-align:center}
.allclear .ac-ic{width:40px;height:40px;border-radius:50%;background:var(--good-soft);color:var(--good-deep);display:grid;place-items:center}

/* Lists */
.plainlist{list-style:none;margin:0;padding:0}
.plainlist li{display:flex;align-items:center;gap:9px;padding:9px 16px;border-bottom:1px solid var(--hairline);font-size:13px}
.plainlist li:last-child{border-bottom:none}
.li-date{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px}
.li-main{flex:1;min-width:0}
.li-sub{font-size:11.5px;color:var(--ink-2)}
.emptystate{padding:22px 16px;text-align:center;color:var(--muted);font-size:12.5px;font-style:italic}

/* ============ Toast & banner ============ */
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#FDFBF6;
  padding:7px 16px;border-radius:99px;font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;z-index:90;
  transition:opacity .25s,transform .25s;box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.nudge{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hairline);border-left:3px solid var(--golden);
  border-radius:var(--radius-s);padding:10px 14px;margin:0 0 16px;box-shadow:var(--shadow);font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.nudge .n-actions{margin-left:auto;display:flex;gap:8px}

/* ============ Planner calendar ============ */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dow{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0;font-weight:600}
.cal .day{background:var(--surface-alt);border:1px solid var(--hairline);border-radius:8px;min-height:78px;padding:5px 6px;font-size:11px;position:relative;min-width:0}
.cal .day.out{opacity:.42}
.cal .day.today{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.cal .dnum{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.cal .day.today .dnum{color:var(--brand-deep)}
.cal .ev{display:block;background:var(--coral-soft);color:var(--coral-deep);border-radius:5px;padding:1px 5px;margin-top:3px;
  font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev[data-action]{cursor:pointer}
.cal .ev[data-action]:hover{filter:brightness(.96)}
.cal .ev.ev-auto{background:var(--teal-soft);color:var(--teal-deep)}
.cal .busy{position:absolute;top:4px;right:5px;font-size:9px;font-weight:700;color:var(--warning-deep);background:var(--warning-soft);
  border-radius:99px;padding:0 5px;line-height:1.5}
.callegend{display:flex;gap:14px;font-size:11px;color:var(--ink-2);margin-top:10px;flex-wrap:wrap;align-items:center}
.callegend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Checklist */
.checklist{list-style:none;margin:0;padding:0}
.checklist li{display:flex;gap:10px;align-items:flex-start;padding:8px 16px;border-bottom:1px solid var(--hairline);font-size:13px}
.checklist li:last-child{border-bottom:none}
.checklist input[type=checkbox]{accent-color:var(--sage);width:15px;height:15px;margin-top:2px;flex:0 0 auto}
.checklist .done{color:var(--muted);text-decoration:line-through}

/* Filters */
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--hairline);font-size:12.5px}
select.flt{font:inherit;font-size:12.5px;border:1px solid var(--hairline);border-radius:10px;padding:4px 8px;background:var(--surface);color:var(--ink)}

/* Report */
.report-page .card{box-shadow:none}
.rep-sec{margin-bottom:14px}
.rep-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}

/* ============ Social components ============ */
/* Platform switcher pills — accent monograms are decorative identity, never a data encoding */
.platbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.platpill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 5px;border-radius:999px;border:1px solid var(--hairline);
  background:var(--surface);font-size:12.5px;color:var(--ink-2);transition:border-color .15s,background .15s}
.platpill:hover{border-color:var(--teal)}
.platpill[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--ink);font-weight:600}
.platpill .pp-foll{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink);font-family:var(--display);letter-spacing:-.01em}
.plat-mono{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;
  letter-spacing:.02em;color:var(--surface);font-family:var(--display);flex:0 0 auto}
.plat-mono svg{width:58%;height:58%;display:block}
.platnote{font-size:11.5px;color:var(--muted);font-style:italic}

/* Feed-grid preview — gradient placeholder tiles keyed to pillar accents (no images, file stays self-contained) */
.feedgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:10px;overflow:hidden;display:grid;place-items:center;border:1px solid var(--hairline);min-width:0}
.thumb .th-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.thumb .th-pill{position:absolute;bottom:5px;right:6px;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--surface)}
.thumb .th-add{position:absolute;bottom:5px;left:5px;width:22px;height:22px;border-radius:7px;background:var(--surface);
  border:1px solid var(--hairline);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;opacity:.92}
.thumb .th-add:hover{color:var(--teal-deep);border-color:var(--teal)}
.thumb .th-del{left:31px}
.thumb .fmt-badge{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:6px;background:var(--surface);
  border:1px solid var(--hairline);color:var(--ink-2);display:grid;place-items:center}
.thumb .th-date{position:absolute;bottom:4px;left:5px;font-size:9px;font-weight:700;color:var(--ink-2);background:var(--surface);border-radius:5px;padding:0 5px;line-height:1.6}
.thumb .th-date-top{bottom:auto;top:5px} /* platform logos own the bottom-left corner */
.thumb .th-plats{position:absolute;bottom:4px;left:4px;display:flex;gap:3px;max-width:calc(100% - 22px);flex-wrap:wrap}
.thumb .th-plats .plat-mono{border:1.5px solid var(--surface);flex:0 0 auto}
.thumb.thumb-sched{border:1.5px dashed var(--muted)}
.thumb.thumb-sched .th-img{opacity:.6}
.ptone-0{background:linear-gradient(135deg,var(--coral-soft),var(--surface-alt));color:var(--coral-deep)}
.ptone-1{background:linear-gradient(135deg,var(--aqua-soft),var(--surface-alt));color:var(--aqua-deep)}
.ptone-2{background:linear-gradient(135deg,var(--golden-soft),var(--surface-alt));color:var(--golden-deep)}
.ptone-3{background:linear-gradient(135deg,var(--teal-soft),var(--surface-alt));color:var(--teal-deep)}
.ptone-4{background:linear-gradient(135deg,var(--serious-soft),var(--surface-alt));color:var(--serious-deep)}
.ptone-5{background:linear-gradient(135deg,var(--info-soft),var(--surface-alt));color:var(--info-deep)}

/* Fixed-size thumb variants — lg: post-card header · md: list rows · sm: compact rows */
.thumb.th-lg{width:100px;height:100px;aspect-ratio:auto;border-radius:12px;flex:0 0 auto}
.thumb.th-md{width:78px;height:78px;aspect-ratio:auto;border-radius:11px;flex:0 0 auto}
.thumb.th-sm{width:46px;height:46px;aspect-ratio:auto;border-radius:9px;flex:0 0 auto}
.thumb.th-md .fmt-badge{width:19px;height:19px;top:4px;right:4px;border-radius:6px}

/* Format-badged post cards */
.postcard .pc-head{display:flex;gap:12px;align-items:flex-start;padding:12px 14px 0}
.postcard .pc-headmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.postcard .pc-title{display:flex;align-items:center;gap:6px;min-width:0;font-weight:600}
.postcard .pc-title .ed{flex:1}
.postcard .pc-meta{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px 0;align-items:center;font-size:12px}
.pc-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:10px 14px}
.pcs{background:var(--surface-alt);border:1px solid var(--hairline);border-radius:8px;padding:4px 7px;min-width:0}
.pcs .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;white-space:nowrap}
.pcs .v{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.metricchips{display:flex;gap:6px;flex-wrap:wrap;padding:9px 14px;border-top:1px solid var(--hairline);background:var(--surface-alt);align-items:center}
@media (max-width:400px){.pc-stats{grid-template-columns:repeat(3,1fr)}}

/* Engagement funnel — tapering stepped bars with conversion connectors */
.funnel{display:flex;flex-direction:column;align-items:center;padding:6px 0}
.fstep{width:var(--w);min-width:110px;max-width:100%;border-radius:9px;padding:7px 12px;text-align:center;font-size:11.5px;font-weight:600}
.fstep b{font-family:var(--display);font-size:17px;letter-spacing:-.01em;display:block;font-variant-numeric:tabular-nums}
.fs-0{background:var(--teal-soft);color:var(--teal-deep)}
.fs-1{background:var(--aqua-soft);color:var(--aqua-deep)}
.fs-2{background:var(--coral-soft);color:var(--coral-deep)}
.fs-3{background:var(--golden-soft);color:var(--golden-deep)}
.fconn{font-size:11.5px;color:var(--ink-2);padding:3px 0;display:flex;gap:6px;align-items:center}
.fconn b{font-variant-numeric:tabular-nums;color:var(--ink)}
.fconn.fc-weak,.fconn.fc-weak b{color:var(--serious-deep);font-weight:700}

/* Best-time heatmap — 7 days × 4-hour buckets, aqua intensity ramp */
.heatmap{display:grid;grid-template-columns:40px repeat(6,1fr);gap:4px;font-size:10px}
.hm-lab{color:var(--muted);display:flex;align-items:center;font-weight:600}
.hm-col{color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-cell{border-radius:6px;background:var(--slate-soft);position:relative;min-height:22px}
.hm-cell.hollow{background:transparent;border:1px dashed var(--hairline)}
.h0{background:var(--slate-soft)}
.h1{background:var(--aqua-soft)}
.h2{background:var(--aqua);opacity:.4}
.h3{background:var(--aqua);opacity:.7}
.h4{background:var(--aqua)}
.hm-best{box-shadow:0 0 0 2px var(--coral)}
.hm-best::after{content:'★';position:absolute;inset:0;display:grid;place-items:center;color:var(--surface);font-size:11px}
.hm-legend{display:flex;gap:5px;align-items:center;font-size:10.5px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.hm-legend i{width:13px;height:13px;border-radius:4px;display:inline-block}

/* Posting-streak calendar — contribution-style grid, teal ramp */
.streakwrap{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.streak{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;justify-content:start}
.sk-cell{width:11px;height:11px;border-radius:3px;background:var(--slate-soft)}
.s1{background:var(--teal-soft)}
.s2{background:var(--teal);opacity:.55}
.s3{background:var(--teal)}
.sk-cell.sk-today{box-shadow:0 0 0 1.5px var(--coral)}
.sk-cell.sk-future{background:transparent;border:1px dashed var(--hairline);width:9px;height:9px}
.streaklegend{display:flex;gap:4px;align-items:center;font-size:10.5px;color:var(--muted);margin-top:8px}
.streaklegend i.sk-cell{display:inline-block}
.streakstats{display:flex;flex-direction:column;gap:6px;font-size:12.5px;min-width:130px;flex:1}
.streakstats b{font-family:var(--display);letter-spacing:-.01em}

/* Pillar mix legend rows */
.mixrow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0}
.mixrow .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.mixrow .mx-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mixrow .mx-nums{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:11.5px;white-space:nowrap}

/* Trend watchlist rows with expiry chips — stacked layout, nothing can overlap */
.trendcard{display:flex;flex-direction:column;gap:6px;padding:10px 16px;border-bottom:1px solid var(--hairline);font-size:13px;min-width:0}
.trendcard:last-child{border-bottom:none}
.trendcard .tr-top{display:flex;gap:8px;align-items:center;min-width:0}
.trendcard .tr-top .ed{flex:1}
.trendcard .tr-sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-left:28px;color:var(--ink-2);font-size:12px}

/* Golden-hour pulse — the reduced-motion block below disables the animation */
.golden-dot{width:9px;height:9px;border-radius:50%;background:var(--golden);flex:0 0 auto;animation:pulseDot 1.6s ease-in-out infinite}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 var(--golden-soft)}50%{box-shadow:0 0 0 5px var(--golden-soft)}}

/* Production pipeline board */
.pipeboard{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pipecol{background:var(--surface-alt);border:1px solid var(--hairline);border-radius:10px;padding:8px;min-width:0}
.pipecol h4{margin:0 0 6px;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;font-weight:700}
.pipeitem{background:var(--surface);border:1px solid var(--hairline);border-radius:8px;padding:6px 8px;font-size:11.5px;margin-bottom:6px;min-width:0;overflow:hidden;cursor:pointer}
.pipeitem:hover{border-color:var(--teal)}
.pipeitem .pi-meta{display:flex;gap:5px;align-items:center;margin-top:4px;flex-wrap:wrap;min-width:0;max-width:100%}
.pipeitem .chip{max-width:100%;overflow:hidden}
@media (max-width:1100px){.pipeboard{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.pipeboard{grid-template-columns:repeat(2,1fr)}}

/* Dual-metric horizontal bars (format comparison) */
.hbar-duo .hb-track{height:8px;margin:1.5px 0}
.hb-fill.hb-aqua{background:var(--aqua)}
.hbar:hover .hb-fill.hb-aqua{background:var(--aqua-deep)}
.duo-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-2);margin-top:9px;align-items:center;flex-wrap:wrap}
.duo-legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* Home hero content rail — big post tiles with performance overlaid on the image */
.postrail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,200px);gap:10px;overflow-x:auto;padding:14px 16px;scrollbar-width:thin;justify-content:start}
.rail-tile{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;cursor:pointer;border:1px solid var(--hairline);min-width:0}
.rail-tile>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.rail-tile .rt-scrim{position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(14,24,30,.85) 100%)}
.rail-tile .rt-meta{position:absolute;left:9px;right:9px;bottom:8px;color:#fff;font-size:10.5px;line-height:1.4}
.rail-tile .rt-title{font-weight:700;font-family:var(--display);letter-spacing:-.01em;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rail-tile .rt-sub{opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rail-tile .plat-mono{position:absolute;top:7px;left:7px}
.rail-tile .fmt-badge{position:absolute;top:7px;right:7px;width:20px;height:20px;border-radius:6px;background:var(--surface);border:1px solid var(--hairline);color:var(--ink-2);display:grid;place-items:center}
.rail-tile.rt-sched{border:1.5px dashed var(--muted)}
.rail-tile.rt-sched>img{opacity:.78}
.rail-tile.rt-ghost{border:1.5px dashed var(--hairline);cursor:default}
.anim .postrail .rail-tile{animation:fadeUp .5s cubic-bezier(.22,.9,.35,1) both}
.anim .postrail .rail-tile:nth-child(2){animation-delay:50ms}
.anim .postrail .rail-tile:nth-child(3){animation-delay:100ms}
.anim .postrail .rail-tile:nth-child(4){animation-delay:150ms}
.anim .postrail .rail-tile:nth-child(5){animation-delay:200ms}
.anim .postrail .rail-tile:nth-child(6){animation-delay:250ms}
.anim .postrail .rail-tile:nth-child(n+7){animation-delay:300ms}

/* Post editor modal — the full post card in an overlay; every field autosaves */
.pmodal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:18px}
.pmodal .pm-scrim{position:absolute;inset:0;background:rgba(20,30,34,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.pmodal .pm-panel{position:relative;width:min(470px,94vw);max-height:92vh;overflow:auto;border-radius:var(--radius);box-shadow:0 24px 80px -24px rgba(0,0,0,.5);background:var(--surface)}
.pmodal .pm-head{display:flex;align-items:center;gap:9px;padding:11px 16px;background:var(--surface-alt);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:1}
.pmodal .pm-head h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.11em;font-weight:700}
.pmodal .pm-head .pm-hint{font-size:11.5px;color:var(--muted);font-style:italic}
.pmodal .postcard{grid-column:unset;width:100%;border:none;border-radius:0;box-shadow:none}
/* in the editor the photo is the hero — much larger than the grid-card thumb */
.pmodal .postcard .thumb.th-lg{width:200px;height:200px;border-radius:14px}
.pmodal .postcard .thumb.th-lg .th-pill{width:12px;height:12px;bottom:8px;right:9px}
.pmodal .postcard .thumb.th-lg .fmt-badge{width:26px;height:26px;top:8px;right:8px;border-radius:8px}
.pmodal .postcard .thumb.th-lg .th-add{width:28px;height:28px;bottom:8px;left:8px;border-radius:9px}
.pmodal .postcard .thumb.th-lg .th-del{left:42px}
@media (max-width:520px){.pmodal .postcard .thumb.th-lg{width:132px;height:132px}}

/* "Add" form modal — add buttons open this instead of dropping a placeholder row */
.pm-form{width:min(420px,94vw)}
.addform{display:grid;gap:12px;padding:16px}
.af-row{display:grid;gap:5px}
.af-l{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.addform .af-in{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--hairline);border-radius:9px;padding:8px 10px;width:100%;box-sizing:border-box;min-height:40px}
.addform .af-in::placeholder{color:var(--muted);opacity:.8}
.addform .af-in:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
.af-foot{display:flex;justify-content:flex-end;gap:8px;padding:2px 16px 16px}

/* Milestone flags on sparklines */
.spark line.mark-stem{stroke:var(--golden-deep);stroke-width:1.5}
.spark path.mark-flag{fill:var(--golden);stroke:var(--golden-deep);stroke-width:.6}
.spark text.mark-l{fill:var(--golden-deep);font-size:9px;font-weight:700;font-family:var(--sans)}

/* ============ Responsive ============ */
@media (max-width:1100px){
  .c4,.c3,.c5{grid-column:span 6}
  .c7,.c8{grid-column:span 12}
}
@media (max-width:860px){
  #sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:transform .22s ease;box-shadow:var(--shadow);height:100dvh}
  body.nav-open #sidebar{transform:translateX(0)}
  #scrim{display:none;position:fixed;inset:0;background:rgba(43,42,38,.32);z-index:35}
  body.nav-open #scrim{display:block}
  #menuToggle{display:inline-flex}
  .tb-greet{display:none}
}
@media (max-width:700px){
  .c4,.c3,.c5,.c6{grid-column:span 12}
  .cal .day{min-height:56px}
  .cal .ev{display:none}
  .cal .day .evdots{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
  .tb-actions .btn span.bl{display:none}
}
@media (min-width:701px){.cal .evdots{display:none}}
.evdot{width:6px;height:6px;border-radius:50%;background:var(--coral)}
.evdot.ev-auto{background:var(--teal)}

/* ============ Entry animations ============
   Applied only when <main> carries .anim (initial load + view switches, never edit re-renders).
   Base states equal the final state — hidden/offset states live only in from{} keyframes,
   so prefers-reduced-motion's animation:none (below) and print show the finished dashboard. */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}
.anim .grid>.card{animation:fadeUp .45s cubic-bezier(.22,.9,.35,1) both}
.anim .grid>.card:nth-child(2){animation-delay:60ms}
.anim .grid>.card:nth-child(3){animation-delay:120ms}
.anim .grid>.card:nth-child(4){animation-delay:180ms}
.anim .grid>.card:nth-child(5){animation-delay:240ms}
.anim .grid>.card:nth-child(6){animation-delay:300ms}
.anim .grid>.card:nth-child(7){animation-delay:360ms}
.anim .grid>.card:nth-child(n+8){animation-delay:420ms}
@keyframes drawline{from{stroke-dashoffset:1}}
@keyframes fadein{from{opacity:0}}
.anim .spark path.line{stroke-dasharray:1 1;animation:drawline 1s .25s ease-out both}
.anim .spark path.area{animation:fadein .7s .55s ease both}
.anim .spark circle,.anim .spark text.direct{animation:fadein .4s .95s ease both}
.anim .minispark path{stroke-dasharray:1 1;animation:drawline .8s .35s ease-out both}
.anim .minispark circle{animation:fadein .35s .95s ease both}
@keyframes sweep{from{stroke-dashoffset:var(--dash)}}
.anim .gauge circle.val,.anim .donut circle.val{animation:sweep .9s .15s ease-out both}
.anim .donutseg circle.seg{animation:fadein .6s .25s ease both}
.anim .minibars rect{animation:fadein .5s .3s ease both}
.anim .hbar .hb-fill{animation:growbar .7s .25s cubic-bezier(.22,.9,.35,1) both}
@keyframes growbar{from{width:0}}
@keyframes growfunnel{from{width:0;opacity:0}}
.anim .fstep{animation:growfunnel .6s cubic-bezier(.22,.9,.35,1) both}
.anim .hm-cell{animation:fadein .5s .2s ease both}
.anim .sk-cell{animation:fadein .45s .2s ease both}
.anim .feedgrid .thumb{animation:fadeUp .45s .15s cubic-bezier(.22,.9,.35,1) both}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ============ Print (Client Report) ============ */
@media print{
  body{background:#fff}
  #sidebar,#topbar,#toast,.nudge,.noprint,#scrim,.rowdel,.rowedit,.pmodal{display:none!important}
  main{padding:0;max-width:none}
  .card{box-shadow:none;break-inside:avoid}
  .viewhead .vh-aux{display:none}
}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea.ed-area{display:block;width:100%;min-height:72px;resize:vertical;border:1px dashed transparent;border-radius:10px;
  padding:8px 10px;background:var(--surface-alt);font:inherit;color:var(--ink);line-height:1.55}
textarea.ed-area:hover{border-color:var(--muted)}
textarea.ed-area.ed-empty{background:var(--slate-soft);border-color:var(--muted)}
textarea.ed-area:focus{outline:none;border:1px solid var(--teal);background:var(--surface)}
abbr{text-decoration:none;border-bottom:1px dotted var(--muted);cursor:help}
code{background:var(--surface-alt);border:1px solid var(--hairline);border-radius:4px;padding:0 4px;font-size:.9em}
.sample-chip{font-size:9.5px;letter-spacing:.06em;padding:1px 6px;margin-left:6px;
  vertical-align:1px;opacity:.75}
.startgrid{gap:13px}
.startlist{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.startlist li{display:flex;gap:10px;align-items:baseline;font-size:12.5px}
.startlist li strong{flex:0 0 148px;color:var(--ink)}
.startre{margin:10px 0 0;padding-top:9px;border-top:1px solid var(--hairline);
  color:var(--ink-2);font-size:12.5px}
.ed-demo{background:var(--golden-soft);border-bottom:1px dashed var(--golden-deep);
  border-radius:4px;padding:0 5px}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="app">
  <nav id="sidebar" aria-label="Sections"></nav>
  <div id="scrim" aria-hidden="true"></div>
  <div class="mainwrap">
    <header id="topbar"></header>
    <main id="main" tabindex="-1"></main>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tooltip" class="tooltip" hidden></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden aria-hidden="true">
<input type="file" id="postImgFile" accept="image/*" hidden aria-hidden="true">
<script>
'use strict';
/* ================================================================
   Clearly Social Media Dashboard — icons, utilities, datasets
================================================================ */
/* Build flags: DEMO=false is the product (opens clean, buyer's own data).
   DEMO=true is the hosted live-demo build (opens pre-filled with sample data).
   DEMO_LOCKED=true (listing demo only) additionally disables persistence and
   backup/restore — edits last until refresh, so a saved copy of the demo page
   can't replace the product. */
const DEMO = true;
const DEMO_LOCKED = true;

const ICONS = {
  home:'<path d="M3 9.5 12 3l9 6.5V20a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20Z"/><path d="M9 21.5v-8h6v8"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  zap:'<path d="M13 2 3 14h8l-1 8 11-13h-9Z"/>',
  users:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M15 3.13a4 4 0 0 1 0 7.75"/>',
  pulse:'<path d="M22 12h-4l-3 8L9 4l-3 8H2"/>',
  calendar:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 9.5h18"/>',

  num(v, d = 1) { const n = num(v); return n === null ? '—' : n.toLocaleString('en-US', {maximumFractionDigits: d, minimumFractionDigits: 0}); },
  pct(v, d = 1) { const n = num(v); return n === null ? '—' : n.toLocaleString('en-US', {maximumFractionDigits: d}) + '%'; },
  money(v, d = 0) { const n = num(v); return n === null ? '—' : '$' + n.toLocaleString('en-US', {maximumFractionDigits: d, minimumFractionDigits: d}); },
  money2(v) { return fmt.money(v, 2); },
  signed(v, d = 1) { const n = num(v); return n === null ? '—' : (n > 0 ? '+' : '') + n.toLocaleString('en-US', {maximumFractionDigits: d}) + '%'; },
  compact(v) { // 12,400 → 12.4k — follower counts in tight pills
    const n = num(v); if (n === null) return '—';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toLocaleString('en-US', {maximumFractionDigits: 1}) + 'M';
    if (Math.abs(n) >= 10000) return (n / 1e3).toLocaleString('en-US', {maximumFractionDigits: 1}) + 'k';

};

function sampleData() {

  const pilEd = uid(), pilBts = uid(), pilProd = uid(), pilTrend = uid();
  const PILS = [pilEd, pilBts, pilProd, pilTrend];

  const HOOKS = [

    'I tested this for 30 days so you don’t have to',
    '3 things I wish I knew before I started',
    'The $12 fix everyone overlooks',
    'Nobody talks about this part of small-batch making',

  const CTAS = ['Save this for later 📌', 'Comment "GUIDE" and I’ll send it', 'Follow for part 2', 'Full breakdown at the link in bio', 'Share this with a friend who needs it', 'Which one are you trying first?'];
  const TITLES = {

    [pilBts]:   ['Studio morning reset', 'Packing 40 orders', 'How we photograph product', 'A real Tuesday, unedited', 'Restock day chaos', 'Sample fails & retries'],

    [pilTrend]: ['That sound + our towels', 'Trend: 5-second transform', 'ASMR restock', 'Get-ready-with-my-shelf', 'Trend remix: before/after', 'One-take challenge'],
  };

  /* Posted rows — a deterministic weekly plan per platform, ~10 weeks back.
     Slot: [dow(0=Mon), 'HH:MM', format, pillarIdx]. Times cluster in the
     evening and on Tue/Thu/Sun so the best-time heatmap shows a real pattern. */
  const PLANS = {
    ig: {er: 3.7, base: 5200, slots: [[1, '18:30', 'reel', 3], [3, '12:15', 'carousel', 0], [6, '19:45', 'static', 1]]},
    tt: {er: 4.3, base: 8400, slots: [[1, '19:30', 'reel', 3], [2, '18:15', 'reel', 0], [4, '20:00', 'reel', 2]]},
    yt: {er: 3.8, base: 2400, slots: [[5, '17:00', 'video', 0]]},

    fb: {er: 5.0, base: 1900, slots: [[2, '12:30', 'static', 2], [5, '17:30', 'static', 1]]},
    x:  {er: 4.5, base: 1400, slots: [[1, '12:00', 'static', 0], [3, '17:15', 'static', 3]]},

  const FMT_ER = {reel: 1.5, carousel: 1.2, static: 0.75, story: 0.6, video: 1.35, live: 1.0};
  const posts = [];
  const todayLocal = localISO(new Date());
  let n = 0;
  Object.entries(PLANS).forEach(([pid, plan]) => {
    for (let w = 0; w <= 10; w++) {
      plan.slots.forEach((slot, s) => {
        // a rough patch ~6–9 weeks back drops a slot here and there, so the streak
        // grid shows a believable dip + best run — while RECENT weeks run clean,
        // keeping current-month consistency (and the health score) high no matter
        // what day of the month the demo/screenshots regenerate on
        if (w >= 6 && w <= 9 && (w + s) % 4 === 2) return;
        const [dow0, time0, format, pi] = slot;
        // wobble the exact weekday/time a little so the best-time heatmap has texture
        const dow = (w % 4 === 1 && s === 2) ? (dow0 + 1) % 7 : dow0;
        const date = isoDow(dow, w);
        if (w === 0 && date >= todayLocal) return; // current week: only days already past
        let hh = parseInt(time0, 10) + ((w + s * 2) % 5) - 2;
        let mm = time0.slice(3);
        if ((w * (s + 2)) % 7 === 3) { hh = 9; mm = '15'; }
        hh = Math.max(8, Math.min(21, hh));
        const time = String(hh).padStart(2, '0') + ':' + mm;
        const wob = 0.7 + ((w * 3 + s * 5 + n) % 7) / 7 * 0.9;         // 0.7–1.6× reach wobble
        const drift = 1.12 - w * 0.022;                                 // newer months reach a bit further
        let reach = Math.round(plan.base * wob * drift);
        let follows = Math.round(reach * 0.0016);
        let notes = '';
        let boostSpend = null;
        if (pid === 'tt' && w === 3 && s === 0) { reach = Math.round(plan.base * 7.4); follows = 240; notes = 'Breakout — trend audio, pinned comment'; boostSpend = 60; }
        if (pid === 'ig' && w === 6 && s === 0) { reach = Math.round(plan.base * 4.8); follows = 130; notes = 'Reel picked up by explore — boosted'; boostSpend = 45; }
        if (pid === 'yt' && w === 8 && s === 0) { reach = Math.round(plan.base * 3.2); follows = 85; notes = 'Search traffic — evergreen topic'; }
        if (pid === 'ig' && w === 2 && s === 1) { boostSpend = 40; notes = 'Boosted to cold audiences'; }
        const er = plan.er * FMT_ER[format] * (0.85 + ((w + s + n) % 5) * 0.075);
        const inter = Math.round(reach * er / 100);
        const saveShare = pi === 0 ? 0.30 : 0.235;                      // educational posts get saved more
        const saves = Math.round(inter * saveShare);
        const comments = Math.round(inter * 0.08);
        const shares = Math.round(inter * 0.155);
        const likes = inter - saves - comments - shares;
        posts.push({
          id: uid(), title: TITLES[PILS[pi]][(w + s) % 6], date, time, pid, format,
          pillar: PILS[pi], hook: HOOKS[(w * 2 + s) % HOOKS.length], cta: CTAS[(w + s * 3) % CTAS.length],

          reach, impressions: Math.round(reach * 1.35), likes, comments, shares, saves,

          visits: Math.round(reach * 0.021), follows, linkClicks: Math.round(reach * 0.004),
          boostSpend, img: null, groupId: null, notes,
        });
        n++;
      });

  /* Cross-post one upcoming post to a second platform, so the feed preview

/* ================================================================
   State engine — single object, localStorage with in-memory fallback
================================================================ */
const KEY = DEMO ? 'clearlySocial.demo.v1' : 'clearlySocial.v1';
let storageOK = true;
let storageWhy = 'ok';   // 'ok' | 'full' (out of room) | 'blocked' (storage switched off)
const memStore = {};

function storeGet() {
  try { return localStorage.getItem(KEY); }
  catch (e) { storageOK = false; storageWhy = 'blocked'; return memStore[KEY] ?? null; }
}
/* "Out of room" and "storage is switched off" need different words: one is the buyer's fault
   and fixable by them, the other isn't. Browsers signal a full bucket in three different ways
   depending on age and engine, so check all of them. Returns 'ok' | 'full' | 'blocked'.
   This matters here because every file:// page shares ONE bucket — the photos attached to
   posts in this planner compete with every other Clearly file in the buyer's Downloads. */
function quotaError(e) {
  return e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
    || e.code === 22 || e.code === 1014);
}
function storeSet(v) {
  try {
    localStorage.setItem(KEY, v);
    storageOK = true; storageWhy = 'ok';    // a transient failure must not downgrade us forever
    return 'ok';
  } catch (e) {
    storageOK = false; storageWhy = quotaError(e) ? 'full' : 'blocked';
    memStore[KEY] = v;
    return storageWhy;
  }
}


/* ================================================================
   Sample data lifecycle — the file ships populated so a buyer can see
   how everything works, then clears it in one click. Row collections
   carry sample:true; Setup-style scalars revert only if untouched.
================================================================ */
const SAMPLE_ROW_PATHS = ['posts', 'platforms', 'pillars', 'hooks', 'ideas', 'ctas',
  'trends', 'repurpose', 'competitors', 'milestones', 'deals', 'goals', 'tests'];

function atPath(o, path) {
  return path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
}
function flagSampleRows(d) {
  SAMPLE_ROW_PATHS.forEach(p => {
    const arr = atPath(d, p);
    if (Array.isArray(arr)) arr.forEach(r => { if (r && typeof r === 'object') r.sample = true; });
  });
  return d;
}
function clearSampleData(d) {
  const smp = flagSampleRows(sampleData()), st = starterData();
  SAMPLE_ROW_PATHS.forEach(p => {
    const arr = atPath(d, p);
    if (!Array.isArray(arr)) return;
    const parent = p.includes('.') ? atPath(d, p.slice(0, p.lastIndexOf('.'))) : d;
    const key = p.slice(p.lastIndexOf('.') + 1);
    parent[key] = arr.filter(r => !(r && r.sample));
  });
  ['brand', 'benchmarks', 'money', 'community'].forEach(grp => {
    if (!d[grp] || !smp[grp] || Array.isArray(d[grp])) return;
    Object.keys(smp[grp]).forEach(k => {
      if (JSON.stringify(d[grp][k]) === JSON.stringify(smp[grp][k])) {
        const fb = (st[grp] || {})[k];
        d[grp][k] = fb !== undefined ? fb : (typeof smp[grp][k] === 'number' ? null : '');
      }
    });
  });
  if (d.months && smp.months) {
    Object.keys(smp.months).forEach(k => {
      if (d.months[k] && JSON.stringify(d.months[k]) === JSON.stringify(smp.months[k])) delete d.months[k];
    });
  }
  if (d.reportNotes === smp.reportNotes) d.reportNotes = st.reportNotes || '';
  return d;
}
function sampleActive() {
  return state.meta && state.meta.sample === 'active';
}
function sampleChip(row) {
  return (row && row.sample) ? '<span class="chip neutral sample-chip">SAMPLE</span>' : '';
}
/* Unmissable notice when the browser is not actually saving. Deliberately different
   from sampleBanner in two ways: it shows on EVERY view, not just Home (a buyer who
   is deep in the Calendar needs to know their work is not being kept), and it cannot
   be dismissed — dismissing it would be agreeing to lose data silently.
   Only renders once storage has genuinely failed, so a healthy file never sees it.
   Skipped in the locked demo, where save() returns before touching storage at all. */
function storageBanner() {
  if (DEMO_LOCKED || storageWhy === 'ok') return '';
  const full = storageWhy === 'full';

/* ================================================================
   Derived metrics, health score, alerts
================================================================ */
/* Sum of followers across active platforms (optionally one platform),
   using each platform's latest history snapshot at or before the given month */
function followersAt(d, key, pid = 'all') {
  let sum = null;
  (d.platforms || []).forEach(p => {
    if (!p.active || (pid !== 'all' && p.pid !== pid)) return;
    const ks = Object.keys(p.history || {}).filter(k => k <= key && num(p.history[k]) !== null).sort();
    if (ks.length) sum = (sum ?? 0) + num(p.history[ks[ks.length - 1]]);
  });
  return sum;
}
/* Weeks covered by a set of month keys — the current month counts only up to today,
   so cadence targets prorate mid-month instead of flagging everyone as behind */
function weeksInPeriod(keys) {
  const cur = monthKey();
  let days = 0;
  keys.forEach(k => {
    const [y, m] = k.split('-').map(Number);
    if (k === cur) days += new Date().getDate();
    else if (k < cur) days += new Date(y, m, 0).getDate();
  });
  return Math.max(days / 7, 0.15);
}
function postInteractions(p) {
  const vals = ['likes', 'comments', 'shares', 'saves'].map(f => num(p[f]));
  return vals.every(v => v === null) ? null : vals.reduce((a, v) => a + (v ?? 0), 0);
}

function derive(d, keys = periodMonthsKeys(), pid = 'all') {
  const b = d.benchmarks;
  const P = (d.posts || []).filter(p => p.status === 'posted' && p.date && keys.includes(p.date.slice(0, 7)) && (pid === 'all' || p.pid === pid));
  const S = f => { let s = null; P.forEach(p => { const v = num(p[f]); if (v !== null) s = (s ?? 0) + v; }); return s; };
  const pc = (a, base) => { const q = div(a, base); return q === null ? null : q * 100; };
  const r = {};
  r.monthCount = keys.length;
  r.nPosts = P.length;
  r.reach = S('reach'); r.impressions = S('impressions'); r.likes = S('likes'); r.comments = S('comments');
  r.shares = S('shares'); r.saves = S('saves'); r.visits = S('visits'); r.follows = S('follows'); r.linkClicks = S('linkClicks');
  const inter = [r.likes, r.comments, r.shares, r.saves];
  r.interactions = inter.every(v => v === null) ? null : inter.reduce((a, v) => a + (v ?? 0), 0);
  r.erReach = pc(r.interactions, r.reach);
  r.saveRate = pc(r.saves, r.reach);
  r.shareRate = pc(r.shares, r.reach);
  r.commentRate = pc(r.comments, r.reach);
  const wp = P.map(p => num(p.watchPct)).filter(v => v !== null);
  r.watchAvg = wp.length ? wp.reduce((a, v) => a + v, 0) / wp.length : null;
  r.visitRate = pc(r.visits, r.reach);
  r.followConv = pc(r.follows, r.reach);
  r.linkCtr = pc(r.linkClicks, r.reach);

  // Followers & growth — from monthly snapshots, not per-post math
  r.followersNow = followersAt(d, keys[keys.length - 1], pid);
  r.followersStart = followersAt(d, addMonths(keys[0], -1), pid);
  r.netFollowers = (r.followersNow !== null && r.followersStart !== null) ? r.followersNow - r.followersStart : null;
  r.growthPct = pc(r.netFollowers, r.followersStart);
  r.growthBench = num(b.growth) !== null ? num(b.growth) * keys.length : null; // monthly benchmark scaled to the period
  r.erFoll = (r.followersNow && r.nPosts) ? pc(div(r.interactions, r.nPosts), r.followersNow) : null;
  r.reachRate = (r.followersNow && r.nPosts) ? pc(div(r.reach, r.nPosts), r.followersNow) : null;

  // Posting cadence → consistency
  const plats = (d.platforms || []).filter(p => p.active && (pid === 'all' || p.pid === pid));
  const cadSum = plats.reduce((a, p) => a + (num(p.cadence) ?? 0), 0);
  r.cadenceTarget = cadSum > 0 ? Math.max(1, Math.round(cadSum * weeksInPeriod(keys))) : null;
  r.cadenceActual = r.nPosts;
  r.consistencyPct = r.cadenceTarget ? r.nPosts / r.cadenceTarget * 100 : null;

  // The growth funnel — reach → profile visits → follows → link clicks
  r.funnel = [
    {key: 'reach', label: 'Reach', v: r.reach},
    {key: 'visits', label: 'Profile visits', v: r.visits},
    {key: 'follows', label: 'New follows', v: r.follows},
    {key: 'linkClicks', label: 'Link clicks', v: r.linkClicks},
  ];

  // Monthly manual aggregates (community ops + non-deal revenue), email's F() pattern
  const F = f => {
    let s = null;
    keys.forEach(k => {
      const mo = d.months && d.months[k];
      const v = mo ? num(mo[f]) : null;
      if (v !== null) s = (s ?? 0) + v;
    });
    return s;
