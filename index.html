  r.commentsIn = F('commentsIn'); r.commentsReplied = F('commentsReplied');
  r.dmsIn = F('dmsIn'); r.dmsHandled = F('dmsHandled'); r.engageMin = F('engageMin');
  r.affiliateRev = F('affiliateRev'); r.shopRev = F('shopRev');
  r.bioClicks = F('bioClicks'); r.bioConv = F('bioConv');
  r.replyRate = pc(r.commentsReplied, r.commentsIn);
  r.bioConvRate = pc(r.bioConv, r.bioClicks);

  // Brand deals by due month — money is program-level, so the platform filter doesn't apply
  const deals = d.deals || [];
  const inKeys = dt => dt && keys.includes(String(dt).slice(0, 7));
  const sumFees = list => list.length ? list.reduce((a, x) => a + (num(x.fee) ?? 0), 0) : null;
  r.dealRevPaid = sumFees(deals.filter(x => x.status === 'paid' && inKeys(x.due)));
  r.dealRevBooked = sumFees(deals.filter(x => ['signed', 'delivered', 'invoiced', 'paid'].includes(x.status) && inKeys(x.due)));
  const mon = [r.dealRevPaid, r.affiliateRev, r.shopRev];
  r.monetizeRev = mon.every(v => v === null) ? null : mon.reduce((a, v) => a + (v ?? 0), 0);

  // Ads & boosts — spend only, by design: the ads manager keeps the campaign detail,
  // this connects spend to the net number. boostSpend lives on posts, adSpend on months.
  r.boostSpend = S('boostSpend');
  r.adSpendMonthly = F('adSpend');
  const spend = [r.boostSpend, r.adSpendMonthly];
  r.adSpend = spend.every(v => v === null) ? null : spend.reduce((a, v) => a + (v ?? 0), 0);
  r.costPer1kReach = (r.adSpend !== null && r.reach) ? r.adSpend / (r.reach / 1000) : null;
  r.netMonetize = (r.monetizeRev === null && r.adSpend === null) ? null : (r.monetizeRev ?? 0) - (r.adSpend ?? 0);

  // Most recent posted date per platform (all-time) — staleness chips + alerts
  r.lastPostByPid = {};
  (d.posts || []).forEach(p => {
    if (p.status === 'posted' && p.date) {
      if (!r.lastPostByPid[p.pid] || p.date > r.lastPostByPid[p.pid]) r.lastPostByPid[p.pid] = p.date;
    }
  });

  // Sub-scores — weighted average of whatever has data.
  // Consistency only starts scoring once the user has EVER logged a post — a brand-new
  // dashboard should read "no data yet", not "0/100 critical".
  const hasAnyPosted = (d.posts || []).some(p => p.status === 'posted');
  r.subConsistency = (r.consistencyPct === null || !hasAnyPosted) ? null : clamp(Math.round(r.consistencyPct), 0, 100);
  const ratios = [div(r.erReach, b.er), div(r.saveRate, b.saveRate), div(r.shareRate, b.shareRate)].filter(v => v !== null);
  r.subEngage = ratios.length
    ? clamp(Math.round(ratios.reduce((a, v) => a + Math.min(v, 1.3), 0) / ratios.length / 1.3 * 100), 0, 100)
    : null;
  const gBench = num(b.growth) || 2.5;
  const gm = r.growthPct === null ? null : r.growthPct / keys.length; // monthly-equivalent growth
  if (gm === null) r.subGrowth = null;
  else if (gm >= gBench * 1.5) r.subGrowth = 100;
  else if (gm >= 0) r.subGrowth = Math.round(50 + gm / (gBench * 1.5) * 50);
  else r.subGrowth = clamp(Math.round(50 + gm * 10), 0, 50);
  // Monetization is optional — no goal and no revenue leaves it out of the average
  // entirely, so hobbyist creators aren't penalized for not selling
  const goal = num(d.money && d.money.incomeGoal);
  /* No goal and no revenue is "no data", not a perfect score — an empty or
     freshly cleared file must not read Excellent. */
  r.subMonetize = goal
    ? clamp(Math.round((r.monetizeRev ?? 0) / (goal * keys.length) * 100), 0, 100)
    : (num(r.monetizeRev) ? 100 : null);

  const parts = [
    {v: r.subConsistency, w: .25, name: 'Consistency'},
    {v: r.subEngage, w: .35, name: 'Engagement'},
    {v: r.subGrowth, w: .25, name: 'Growth'},
    {v: r.subMonetize, w: .15, name: 'Monetization'},
  ].filter(p => p.v !== null);
  const wsum = parts.reduce((a, p) => a + p.w, 0);
  r.health = wsum > 0 ? clamp(Math.round(parts.reduce((a, p) => a + p.v * p.w, 0) / wsum), 0, 100) : null;
  r.weakest = parts.length ? parts.slice().sort((a, b2) => a.v - b2.v)[0] : null;
  return r;
}

/* Best-time heatmap: 7 weekdays × 6 four-hour buckets, avg ER by reach per cell.
   Uses only posts with a time logged — it's honestly "from your own posts". */
function deriveHeat(d, keys = periodMonthsKeys(), pid = 'all') {
  const cells = Array.from({length: 7}, () => Array.from({length: 6}, () => ({n: 0, er: null, sum: 0, cnt: 0})));
  (d.posts || []).forEach(p => {
    if (p.status !== 'posted' || !p.date || !keys.includes(p.date.slice(0, 7))) return;
    if (pid !== 'all' && p.pid !== pid) return;
    const dw = dowIdx(p.date), tb = timeBucket(p.time);
    if (dw === null || tb === null) return;
    const c = cells[dw][tb];
    c.n++;
    const e = div(postInteractions(p), p.reach);
    if (e !== null) { c.sum += e * 100; c.cnt++; }
  });
  cells.forEach(row => row.forEach(c => { c.er = c.cnt ? c.sum / c.cnt : null; }));
  return cells;
}

/* Posting-streak grid: per-day post counts for the last N weeks (columns = weeks,
   Monday-start), plus current/best streak of weeks that hit the cadence target */
function deriveStreak(d, pid = 'all', weeks = 13) {
  const byDay = {};
  (d.posts || []).forEach(p => {
    if (p.status === 'posted' && p.date && (pid === 'all' || p.pid === pid)) byDay[p.date] = (byDay[p.date] || 0) + 1;
  });
  const target = (d.platforms || []).filter(p => p.active && (pid === 'all' || p.pid === pid))
    .reduce((a, p) => a + (num(p.cadence) ?? 0), 0);
  const today = localISO(new Date());
  const grid = [], weekTotals = [];
  for (let wb = weeks - 1; wb >= 0; wb--) {
    let tot = 0;
    for (let dow = 0; dow < 7; dow++) {
      const iso = isoDow(dow, wb);
      const n = byDay[iso] || 0;
      tot += n;
      grid.push({iso, n, today: iso === today, future: iso > today});
    }
    weekTotals.push(tot);
  }
  let cur = 0;
  for (let i = weekTotals.length - 2; i >= 0; i--) { if (target && weekTotals[i] >= target) cur++; else break; }
  if (target && weekTotals[weekTotals.length - 1] >= target) cur++; // current week already hit
  let best = 0, run = 0;
  for (let i = 0; i < weekTotals.length - 1; i++) {
    if (target && weekTotals[i] >= target) { run++; best = Math.max(best, run); } else run = 0;
  }
  best = Math.max(best, cur);
  return {grid, target, thisWeek: weekTotals[weekTotals.length - 1], cur, best};
}

/* Per-format performance + a format index (100 = your overall average ER) */
function deriveFormats(d, keys = periodMonthsKeys(), pid = 'all') {
  const P = (d.posts || []).filter(p => p.status === 'posted' && p.date && keys.includes(p.date.slice(0, 7)) && (pid === 'all' || p.pid === pid));
  const overall = {sum: 0, cnt: 0};
  const acc = {};
  P.forEach(p => {
    const f = FORMATS[p.format] ? p.format : 'static';
    const o = acc[f] = acc[f] || {n: 0, erSum: 0, erCnt: 0, svSum: 0, svCnt: 0, wSum: 0, wCnt: 0};
    o.n++;
    const er = div(postInteractions(p), p.reach), sv = div(p.saves, p.reach), w = num(p.watchPct);
    if (er !== null) { o.erSum += er * 100; o.erCnt++; overall.sum += er * 100; overall.cnt++; }
    if (sv !== null) { o.svSum += sv * 100; o.svCnt++; }
    if (w !== null) { o.wSum += w; o.wCnt++; }
  });
  const avgAll = overall.cnt ? overall.sum / overall.cnt : null;
  return Object.entries(acc).map(([f, o]) => ({
    format: f, n: o.n,
    er: o.erCnt ? o.erSum / o.erCnt : null,
    saveRate: o.svCnt ? o.svSum / o.svCnt : null,
    watchAvg: o.wCnt ? o.wSum / o.wCnt : null,
    share: P.length ? o.n / P.length * 100 : null,
    index: avgAll && o.erCnt ? (o.erSum / o.erCnt) / avgAll * 100 : null,
  })).sort((a, b) => (b.er ?? -1) - (a.er ?? -1));
}

/* Pillar mix (actual vs target) + per-pillar performance */
function derivePillars(d, keys = periodMonthsKeys(), pid = 'all') {
  const P = (d.posts || []).filter(p => p.status === 'posted' && p.date && keys.includes(p.date.slice(0, 7)) && (pid === 'all' || p.pid === pid));
  const rows = (d.pillars || []).map(pl => ({id: pl.id, name: pl.name || 'Untitled pillar', color: pl.color ?? 5, target: num(pl.target), n: 0, erSum: 0, erCnt: 0, saves: 0, follows: 0}));
  const untagged = {id: '', name: 'Untagged', color: 5, target: null, n: 0, erSum: 0, erCnt: 0, saves: 0, follows: 0};
  P.forEach(p => {
    const row = rows.find(x => x.id === p.pillar) || untagged;
    row.n++;
    const er = div(postInteractions(p), p.reach);
    if (er !== null) { row.erSum += er * 100; row.erCnt++; }
    row.saves += num(p.saves) ?? 0;
    row.follows += num(p.follows) ?? 0;
  });
  const list = untagged.n ? rows.concat(untagged) : rows;
  list.forEach(x => {
    x.actualPct = P.length ? x.n / P.length * 100 : null;
    x.er = x.erCnt ? x.erSum / x.erCnt : null;
  });
  return {list, total: P.length};
}

/* What this platform's paid deals actually worked out to per 1,000 followers.
   The deal table sits directly above the calculator, so the two disagreeing in
   public is the fastest way to lose a buyer's trust in the number. Only `paid`
   counts — a pitch is an asking price, not a rate. */
function actualPer1k(d, pid, followers) {
  if (!followers) return null;
  const paid = (d.deals || []).filter(x => x.pid === pid && x.status === 'paid' && num(x.fee) !== null);
  if (!paid.length) return null;
  const avgFee = paid.reduce((a, x) => a + num(x.fee), 0) / paid.length;
  return {n: paid.length, avgFee, per1k: avgFee / (followers / 1000)};
}

/* Rate-card calculator: followers + ER (auto from the last 3 months, both
   overridable) × a $-per-1k base → a suggested sponsored-post price range.

   Both the base and the ER benchmark come from PLATFORM_META, per platform.
   They used to be one global $12 and one global 5%, which priced a YouTube
   integration at $21-33 next to a real $900 YouTube deal.

   `mid` is derived from the SAME rounded ER and multiplier the card prints, so
   a buyer who checks the arithmetic by hand gets the number on screen. Deriving
   it from full-precision inputs made every displayed figure irreconcilable. */
function rateCardCalc(d) {
  const m = d.money || {};
  const pid = m.rcPid || 'ig';
  const meta = PLATFORM_META[pid] || {};
  const rAuto = derive(d, lastNMonthKeys(3), pid);
  const followersRaw = num(m.rcFollowers) ?? rAuto.followersNow;
  const baseRaw = num(m.rcBase) ?? meta.base ?? 12;
  // Negatives used to render "$-4 – $-6" with low and high reversed; 0 followers
  // rendered "$0 – $0" instead of the empty state. Treat both as "not answered".
  const followers = followersRaw !== null && followersRaw > 0 ? followersRaw : null;
  const base = baseRaw !== null && baseRaw > 0 ? baseRaw : null;
  const erRaw = num(m.rcER) ?? rAuto.erReach;
  const er = erRaw !== null && erRaw >= 0 ? erRaw : null;
  // The platform's own benchmark wins. `benchmarks.er` is the CONTENT benchmark —
  // it flags individual posts — and it defaults to 5, which is truthy, so putting
  // it first silently pinned every platform back to one global bar. Only fall
  // through to it when a platform has no benchmark of its own.
  const bench = meta.benchEr ?? (num(d.benchmarks && d.benchmarks.er) || 5);
  const out = {pid, followers, er, base, bench, mult: null, low: null, mid: null, high: null,
               actual: null, gap: null, noBase: base === null && followers !== null};
  if (followers === null || base === null) return out;

  // round first, then compute — so the printed multiplier generates the printed price
  const erShown = er === null ? null : Math.round(er * 10) / 10;
  const mult = erShown === null ? 1 : Math.round(clamp(erShown / bench, 0.5, 2) * 100) / 100;
  const mid = Math.round(followers / 1000 * base * mult);
  Object.assign(out, {er: erShown, mult, mid, low: Math.round(mid * 0.85), high: Math.round(mid * 1.15)});

  const actual = actualPer1k(d, pid, followers);
  if (actual) {
    out.actual = actual;
    // flag only a gap worth acting on, in either direction
    const ratio = actual.per1k / base;
    if (ratio >= 1.25 || ratio <= 0.8) out.gap = ratio > 1 ? 'under' : 'over';
  }
  return out;
}

function healthBand(score) {
  if (score === null) return {cls: 'neutral', label: 'No data yet', color: 'var(--muted)'};
  if (score >= 85) return {cls: 'good', label: 'Excellent', color: 'var(--good)'};
  if (score >= 70) return {cls: 'good', label: 'Healthy', color: 'var(--good)'};
  if (score >= 55) return {cls: 'warning', label: 'Needs attention', color: 'var(--warning)'};
  if (score >= 35) return {cls: 'serious', label: 'At risk', color: 'var(--serious)'};
  return {cls: 'critical', label: 'Critical', color: 'var(--critical)'};
}

const SEV_ORDER = {critical: 0, serious: 1, warning: 2, info: 3};
const SEV_ICON = {critical: 'octagon', serious: 'alert', warning: 'alert', info: 'info'};
function buildAlerts(d, r) {
  const A = [];
  const keys = periodMonthsKeys();
  const rPrev = derive(d, keys.map(k => addMonths(k, -keys.length)), 'all');

  // 1 · Stale platform — silence longer than ~2× the expected posting gap
  (d.platforms || []).forEach(p => {
    if (!p.active || !num(p.cadence)) return;
    const meta = PLATFORM_META[p.pid] || {label: p.pid};
    const last = r.lastPostByPid[p.pid];
    const gap = last ? daysSince(last) : null;
    const staleAfter = Math.max(3, Math.ceil(7 / num(p.cadence)) * 2);
    if (gap === null) A.push({sev: 'info', text: `No posts logged on ${meta.label} yet — log the first one and every chart starts moving.`, view: 'posts'});
    else if (gap > staleAfter) A.push({sev: 'warning', text: `Haven't posted on ${meta.label} in ${gap} days — the algorithm forgets fast. Get the next post scheduled.`, view: 'calendar'});
  });
  // 2 · Engagement rate down vs the previous equal-length period
  if (r.erReach !== null && rPrev.erReach !== null && rPrev.erReach > 0 && r.erReach < rPrev.erReach * 0.85) {
    const drop = (1 - r.erReach / rPrev.erReach) * 100;
    A.push({sev: 'serious', text: `Engagement rate is down ${fmt.num(drop, 0)}% vs last period (${fmt.pct(r.erReach)} vs ${fmt.pct(rPrev.erReach)}) — check the format mix and your hooks.`, view: 'insights'});
  }
  // 3 · Under posting cadence (current month, prorated to today) — only meaningful
  // once the user has ever logged a post (the per-platform "no posts yet" info rows
  // cover the brand-new state)
  const rm = derive(d, [monthKey()], 'all');
  if ((d.posts || []).some(p => p.status === 'posted') && rm.cadenceTarget && rm.cadenceActual < rm.cadenceTarget * 0.8) {
    A.push({sev: 'warning', text: `Under your posting cadence this month — ${rm.cadenceActual} posted vs ~${rm.cadenceTarget} planned so far. Consistency is the score's biggest lever.`, view: 'calendar'});
  }
  // 4 · Golden hour — posts published within the last 60 minutes
  const hot = (d.posts || []).filter(p => {
    if (p.status !== 'posted') return false;
    const mns = minutesSince(p);
    return mns !== null && mns >= 0 && mns <= 60;
  });
  if (hot.length) A.push({sev: 'warning', text: `${hot.length === 1 ? `“${esc(hot[0].title || 'A post')}” is` : `${hot.length} posts are`} in the golden-hour window — replies in the first hour compound reach. Reply now.`, view: 'community'});
  // 5 · Brand-deal deliverable due / overdue
  (d.deals || []).forEach(dl => {
    if (!dl.due || ['delivered', 'invoiced', 'paid'].includes(dl.status)) return;
    const du = daysUntil(dl.due);
    if (du === null) return;
    if (du < 0) A.push({sev: 'serious', text: `“${esc(dl.brand || 'Brand deal')}” deliverable is ${-du} day${du === -1 ? '' : 's'} overdue${dl.deliverable ? ` (${esc(dl.deliverable)})` : ''}.`, view: 'money'});
    else if (du <= 7) A.push({sev: 'warning', text: `Brand-deal deliverable for “${esc(dl.brand || '—')}” due ${du === 0 ? 'today' : `in ${du} day${du === 1 ? '' : 's'}`}${dl.deliverable ? ` — ${esc(dl.deliverable)}` : ''}.`, view: 'money'});
  });
  // 6 · Pillar mix off target (needs a meaningful sample)
  if (r.nPosts >= 8) {
    derivePillars(d, keys, 'all').list.forEach(pl => {
      if (pl.target === null || pl.actualPct === null) return;
      const diff = pl.actualPct - pl.target;
      if (Math.abs(diff) > 10) A.push({sev: 'info', text: `Pillar mix is off — “${esc(pl.name)}” is ${diff > 0 ? 'over' : 'under'} target (${fmt.num(pl.actualPct, 0)}% of posts vs ${fmt.num(pl.target, 0)}% planned).`, view: 'pillars'});
    });
  }
  // 7 · Follower growth stalled (~60 days, per platform)
  (d.platforms || []).forEach(p => {
    if (!p.active) return;
    const meta = PLATFORM_META[p.pid] || {label: p.pid};
    const now = followersAt(d, monthKey(), p.pid);
    const ago = followersAt(d, addMonths(monthKey(), -2), p.pid);
    if (now === null || ago === null || ago <= 0 || now === ago && Object.keys(p.history || {}).length < 2) return;
    const g2 = (now - ago) / ago * 100;
    if (g2 <= 0.2) A.push({sev: 'warning', text: `Follower growth has stalled on ${meta.label} (${fmt.signed(g2)} in ~60 days) — check the funnel for where it leaks.`, view: 'funnel'});
  });
  // 8 · A/B test ready to conclude
  (d.tests || []).forEach(t => {
    if (t.status !== 'running') return;
    const past = t.endDate && daysUntil(t.endDate) !== null && daysUntil(t.endDate) < 0;
    const both = t.aResult && t.bResult && !t.winner;
    if (past || both) A.push({sev: 'info', text: `A/B test “${esc(t.name)}” looks ready to conclude — log the winner and the learning.`, view: 'experiments'});
  });
  return A.sort((a, b2) => SEV_ORDER[a.sev] - SEV_ORDER[b2.sev]);
}

/* Benchmark badge */
function benchBadge(value, target, {higherIsBetter = true, unit = '%'} = {}) {
  const v = num(value), t = num(target);
  if (v === null || t === null) return `<span class="bench flat" aria-label="No benchmark comparison yet">—</span>`;
  const good = higherIsBetter ? v >= t : v <= t;
  const arrow = v >= t ? '▲' : '▼';
  const word = v >= t ? 'above' : 'below';
  return `<span class="bench ${good ? 'up' : 'down'}" role="img" aria-label="${word} benchmark of ${t}${unit} — ${good ? 'on track' : 'off track'}">${arrow} <span aria-hidden="true">${word} ${fmt.num(t)}${unit}</span></span>`;
}

/* Delta vs previous equal-length period — visually subordinate to the benchmark badge */
function deltaBadge(cur, prev, {unit = ' pts', dec = 1, higherIsBetter = true} = {}) {
  const c = num(cur), p = num(prev);
  if (c === null || p === null) return '';
  const diff = c - p;
  const flat = Math.abs(diff) < Math.pow(10, -dec) / 2;
  const arrow = flat ? '·' : diff > 0 ? '▲' : '▼';
  const good = flat ? null : (higherIsBetter ? diff > 0 : diff < 0);
  const txt = flat ? 'level' : `${diff > 0 ? '+' : '−'}${Math.abs(diff).toFixed(dec)}${unit}`;
  return `<span class="bench ${flat ? 'flat' : good ? 'up' : 'down'}" role="img" aria-label="${flat ? 'level with' : (diff > 0 ? 'up ' : 'down ') + Math.abs(diff).toFixed(dec) + unit + ' versus'} the previous period">${arrow} <span aria-hidden="true">${txt} vs prev</span></span>`;
}

/* ================================================================
   Editable field builders
================================================================ */
function edField(path, opts = {}) {
  const raw = getPath(path);
  let display;
  if (opts.type === 'num') display = raw === null || raw === undefined || raw === '' ? '' : Number(raw).toLocaleString('en-US', {maximumFractionDigits: opts.dec ?? 2});
  else display = raw ?? '';
  const w = Math.max(String(display).length, opts.min || (opts.type === 'num' ? 4 : 6)) + 1;
  const attrs = [
    `class="ed ${opts.type === 'num' ? 'ed-num' : ''} ${String(display) === '' ? 'ed-empty' : ''} ${opts.cls || ''}"`,
    `data-path="${path}"`,
    `data-etype="${opts.type || 'text'}"`,
    `value="${esc(display)}"`,
    `style="width:${Math.min(w, opts.max || 40)}ch"`,
    `aria-label="${esc(opts.label || path)}"`,
  ];
  if (opts.type === 'num') attrs.push('inputmode="decimal"', 'autocomplete="off"');
  if (opts.type === 'date') attrs.push('placeholder="YYYY-MM-DD"');
  if (opts.ph) attrs.push(`placeholder="${esc(opts.ph)}"`);
  return `<input ${attrs.join(' ')}>`;
}

  deal: {values: ['pitched', 'negotiating', 'signed', 'delivered', 'invoiced', 'paid'],

function cycleChip(path, set, label) {

function staticChip(kind, ic, text) {

/* Chip-styled reference dropdown (platform / format / pillar pickers) —
   same delegated change handler as cycleChip's .statussel */
function listSel(path, options, label) {
  const val = getPath(path) ?? '';
  const cur = options.find(o => String(o.v) === String(val));
  const text = cur ? cur.t : (options[0] ? options[0].t : '');

}
const platOptions = () => Object.entries(PLATFORM_META).map(([v, m]) => ({v, t: m.label}));
const formatOptions = () => Object.entries(FORMATS).map(([v, m]) => ({v, t: m.label}));
const pillarOptions = d => [{v: '', t: '— pillar'}].concat((d.pillars || []).map(pl => ({v: pl.id, t: pl.name || 'Untitled'})));

/* ================================================================
   SVG chart components (hand-rolled, single-series, sage)
================================================================ */
function gaugeSVG(score, band) {
  const R = 62, C = 2 * Math.PI * R, sz = 168;
  const frac = score === null ? 0 : score / 100;
  const arc = C * 0.75; // 270° gauge
  return `
  <svg class="gauge" width="${sz}" height="${sz - 14}" viewBox="0 0 ${sz} ${sz - 6}" role="img"
       aria-label="Program health score: ${score === null ? 'no data yet' : score + ' out of 100, ' + band.label}">
    <g transform="rotate(135 ${sz / 2} ${sz / 2})">
      <circle class="track" cx="${sz / 2}" cy="${sz / 2}" r="${R}" fill="none" stroke-width="11"
        stroke-dasharray="${arc} ${C}" stroke-linecap="round"/>
      <circle class="val" cx="${sz / 2}" cy="${sz / 2}" r="${R}" fill="none" stroke="${band.color}" stroke-width="11"
        style="--dash:${(arc * frac).toFixed(1)}" stroke-dasharray="${arc * frac} ${C}" stroke-linecap="round"/>
    </g>
    <text class="gv" x="${sz / 2}" y="${sz / 2 + 4}" text-anchor="middle">${score === null ? '—' : score}</text>
    <text class="gl" x="${sz / 2}" y="${sz / 2 + 24}" text-anchor="middle">of 100</text>
  </svg>`;
}

const MONTHS_BACK = (() => {
  const out = [], d = new Date();
  for (let i = 11; i >= 0; i--) {
    const m = new Date(d.getFullYear(), d.getMonth() - i, 1);
    out.push(m.toLocaleDateString('en-US', {month: 'short'}));
  }
  return out;
})();

function sparkSVG(series, {id, w = 560, h = 120, money = true, labels = null, editPaths = null, zeroBase = true, marks = null} = {}) {
  const L = labels || MONTHS_BACK;
  const vals = series.map(num);
  const present = vals.filter(v => v !== null);
  if (!present.length) {
    return `<div class="emptystate">Enter monthly values to draw the trend.</div>` + (editPaths ? `
      <details class="tablefall" open><summary>Edit monthly values</summary>
      <div class="tablewrap"><table class="data" style="min-width:0"><thead><tr>${L.map(mn => `<th class="num">${mn}</th>`).join('')}</tr></thead>
      <tbody><tr>${series.map((v, i) => `<td class="num">${edField(editPaths[i], {type: 'num', min: 3, label: L[i] + ' value'})}</td>`).join('')}</tr></tbody></table></div></details>` : '');
  }
  let max = Math.max(...present), min = zeroBase ? Math.min(...present, 0) : Math.min(...present);
  if (!zeroBase) { const padR = (max - min || Math.abs(max) || 1) * 0.15; max += padR; min -= padR; }
  const pad = {l: 6, r: 6, t: 10, b: 18};
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const X = i => pad.l + (series.length === 1 ? iw / 2 : i / (series.length - 1) * iw);
  const Y = v => pad.t + ih - (max === min ? ih / 2 : (v - min) / (max - min) * ih);
  let line = '', area = '', started = false, firstX = null, lastX = null;
  vals.forEach((v, i) => {
    if (v === null) return;
    const x = X(i), y = Y(v);
    line += (started ? ' L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    if (!started) firstX = x;
    lastX = x; started = true;
  });
  if (started) area = line + ` L${lastX.toFixed(1)} ${(pad.t + ih).toFixed(1)} L${firstX.toFixed(1)} ${(pad.t + ih).toFixed(1)} Z`;
  const gridY = [0.5].map(f => pad.t + ih * f);
  const pts = vals.map((v, i) => v === null ? '' : `<circle class="pt" data-i="${i}" cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3.5"/>`).join('');
  // Direct label on the latest point — Coral marks need a value the eye can read without hover
  let lastI = -1;
  vals.forEach((v, i) => { if (v !== null) lastI = i; });
  const direct = lastI >= 0
    ? `<text class="direct" x="${Math.min(X(lastI), w - pad.r - 4).toFixed(1)}" y="${Math.max(Y(vals[lastI]) - 9, 12).toFixed(1)}" text-anchor="end">${money ? fmt.money(vals[lastI]) : fmt.num(vals[lastI])}</text>`
    : '';
  const axisLabels = series.map((_, i) => (i % 2 === (series.length - 1) % 2) ? `<text x="${X(i).toFixed(1)}" y="${h - 4}" text-anchor="middle">${L[i]}</text>` : '').join('');
  const gid = (id || 'sp') + '-grad'; // per-instance gradient id — two sparks on one page must not collide
  return `
  <svg class="spark" id="${id}" width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="aspect-ratio:${w}/${h};display:block"
       role="img" aria-label="12-month trend. Latest value ${money ? fmt.money(present[present.length - 1]) : fmt.num(present[present.length - 1])}."
       data-series="${vals.map(v => v === null ? '' : v).join('|')}" data-money="${money ? 1 : 0}" data-labels="${L.join('|')}">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop class="gs0" offset="0"/><stop class="gs1" offset="1"/>
    </linearGradient></defs>
    ${gridY.map(y => `<line class="grid" x1="${pad.l}" x2="${w - pad.r}" y1="${y}" y2="${y}"/>`).join('')}
    <path class="area" d="${area}" style="fill:url(#${gid})"/>
    <path class="line" d="${line}" pathLength="1"/>
    <line class="cursor" y1="${pad.t}" y2="${pad.t + ih}" x1="0" x2="0"/>
    ${pts}${direct}${axisLabels}
    <rect x="0" y="0" width="${w}" height="${h}" fill="transparent" data-hover="spark"/>
    ${(marks || []).filter(mk => mk.i >= 0 && mk.i < vals.length && vals[mk.i] !== null).map(mk => {
      // milestone flag — drawn after the hover rect so its own tooltip wins
      const x = X(mk.i), y = Y(vals[mk.i]);
      const fy = Math.max(y - 26, 6);
      return `<g data-tt="${esc(mk.label)}" role="img" aria-label="Milestone: ${esc(mk.label)}">
        <line class="mark-stem" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${(y - 5).toFixed(1)}" y2="${(fy + 9).toFixed(1)}"/>
        <path class="mark-flag" d="M${x.toFixed(1)} ${fy.toFixed(1)} h13 l-4 4.5 4 4.5 h-13 Z"/>
      </g>`;
    }).join('')}
  </svg>
  <details class="tablefall"><summary>View as table${editPaths ? ' / edit values' : ''}</summary>
    <div class="tablewrap"><table class="data" style="min-width:0"><thead><tr>${L.map(mn => `<th class="num">${mn}</th>`).join('')}</tr></thead>
    <tbody><tr>${series.map((v, i) => `<td class="num">${editPaths ? edField(editPaths[i], {type: 'num', min: 3, label: L[i] + ' value'}) : (money ? fmt.money(v) : fmt.num(v))}</td>`).join('')}</tr></tbody></table></div>
  </details>`;
}

function donutSVG(pct, {size = 74, label = '', color = null} = {}) {
  const R = size / 2 - 7, C = 2 * Math.PI * R;
  const frac = pct === null ? 0 : clamp(pct, 0, 100) / 100;
  return `
  <svg class="donut" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${esc(label)}: ${pct === null ? 'no data' : Math.round(pct) + '%'}">
    <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke-width="9"/>
    ${frac > 0 ? `<circle class="val" style="${color ? `stroke:${color};` : ''}--dash:${(C * frac).toFixed(1)}" cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${size / 2} ${size / 2})"/>` : ''}
    <text x="${size / 2}" y="${size / 2 + 4.5}" text-anchor="middle" style="font-size:${size / 5.2}px;font-weight:650;fill:var(--ink);font-family:var(--sans)">${pct === null ? '—' : Math.round(pct) + '%'}</text>
  </svg>`;
}

/* Tiny single-line trend for KPI tiles — no axes, no tooltip; the tile's value + badges carry the meaning */
function miniSparkSVG(series, {w = 120, h = 26, colorVar = '--teal'} = {}) {
  const vals = series.map(num);
  if (vals.filter(v => v !== null).length < 2) return '';
  const present = vals.filter(v => v !== null);
  const max = Math.max(...present), min = Math.min(...present);
  const X = i => 2 + i / (vals.length - 1) * (w - 4);
  const Y = v => 3 + (max === min ? (h - 6) / 2 : (1 - (v - min) / (max - min)) * (h - 6));
  let path = '', started = false, lastX = 0, lastY = 0;
  vals.forEach((v, i) => {
    if (v === null) return;
    lastX = X(i); lastY = Y(v);
    path += (started ? ' L' : 'M') + lastX.toFixed(1) + ' ' + lastY.toFixed(1);
    started = true;
  });
  return `<svg class="minispark" width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="aspect-ratio:${w}/${h}" aria-hidden="true">
    <path d="${path}" pathLength="1" fill="none" style="stroke:var(${colorVar})" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="2.6" style="fill:var(${colorVar});stroke:var(--surface-alt)" stroke-width="1.5"/>
  </svg>`;
}

/* Tiny zero-baseline column chart (e.g. monthly net adds) — rides the generic [data-tt] tooltip */
function miniBarsSVG(series, {w = 240, h = 46, labels = null, fmtV = fmt.signed} = {}) {
  const L = labels || MONTHS_BACK;
  const vals = series.map(num);
  if (vals.filter(v => v !== null).length < 2) return '';
  const present = vals.filter(v => v !== null);
  const top = Math.max(...present, 0), bot = Math.min(...present, 0);
  const span = (top - bot) || 1;
  const zeroY = 2 + (h - 4) * (top / span);
  const bw = Math.max(2, w / vals.length - 3);
  const bars = vals.map((v, i) => {
    if (v === null) return '';
    const x = i / vals.length * w + 1.5;
    const bh = Math.max(1.5, Math.abs(v) / span * (h - 4));
    const y = v >= 0 ? zeroY - bh : zeroY;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="1.5"
      style="fill:var(${v >= 0 ? '--aqua' : '--coral'})" data-tt="${esc(L[i])} · ${esc(fmtV(v))}"/>`;
  }).join('');
  return `<svg class="minibars" width="100%" viewBox="0 0 ${w} ${h}" style="aspect-ratio:${w}/${h}" role="img"
    aria-label="Monthly values, latest ${esc(fmtV(present[present.length - 1]))}">
    <line x1="0" x2="${w}" y1="${zeroY.toFixed(1)}" y2="${zeroY.toFixed(1)}" style="stroke:var(--hairline)" stroke-width="1"/>
    ${bars}
  </svg>`;
}

/* Segmented donut — one ring, several status segments, 2px surface gaps between them */
function donutSegSVG(segs, {size = 74, centerBig = '', centerSub = '', label = ''} = {}) {
  const R = size / 2 - 7, C = 2 * Math.PI * R;
  const total = segs.reduce((a, s) => a + (num(s.v) || 0), 0);
  if (!total) return donutSVG(null, {size, label});
  const gap = segs.filter(s => num(s.v)).length > 1 ? 2.5 : 0;
  let cum = 0;
  const rings = segs.map(s => {
    const v = num(s.v) || 0;
    if (!v) return '';
    const len = Math.max(0, v / total * C - gap);
    const off = -(cum / total * C + gap / 2);
    cum += v;
    return `<circle class="seg" cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke-width="9" stroke-linecap="butt"
      style="stroke:var(${s.colorVar})" stroke-dasharray="${len.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
      transform="rotate(-90 ${size / 2} ${size / 2})"/>`;
  }).join('');
  return `<svg class="donutseg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img"
    aria-label="${esc(label)}: ${segs.filter(s => num(s.v)).map(s => `${s.v} ${s.label}`).join(', ')}">
    <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${R}" fill="none" stroke-width="9" style="stroke:var(--hairline)"/>
    ${rings}
    ${centerBig ? `<text x="${size / 2}" y="${size / 2 + (centerSub ? size / 49 : size / 16.4)}" text-anchor="middle" style="font-size:${size / 5.2}px;font-weight:650;fill:var(--ink);font-family:var(--sans)">${esc(centerBig)}</text>` : ''}
    ${centerSub ? `<text x="${size / 2}" y="${size / 2 + size / 5.7}" text-anchor="middle" style="font-size:${Math.max(8.5, size / 8.7).toFixed(1)}px;fill:var(--muted);font-family:var(--sans)">${esc(centerSub)}</text>` : ''}
  </svg>`;
}

/* Sparkline hover tooltip (delegated) */
const tooltipEl = () => $('#tooltip');
document.addEventListener('pointermove', e => {
  const hoverRect = e.target.closest && e.target.closest('[data-hover="spark"]');
  const tt = tooltipEl();
  if (!hoverRect) { if (!tt.hidden) hideTip(); return; }
  const svg = hoverRect.ownerSVGElement || hoverRect.closest('svg');
  const vals = svg.dataset.series.split('|').map(v => v === '' ? null : parseFloat(v));
  const money = svg.dataset.money === '1';
  const tipLabels = (svg.dataset.labels || '').split('|');
  const rect = svg.getBoundingClientRect();
  const fx = (e.clientX - rect.left) / rect.width;
  let i = clamp(Math.round(fx * (vals.length - 1)), 0, vals.length - 1);
  // snap to nearest non-null
  if (vals[i] === null) {
    let best = -1, bd = 1e9;
    vals.forEach((v, j) => { if (v !== null && Math.abs(j - i) < bd) { bd = Math.abs(j - i); best = j; } });
    if (best < 0) { hideTip(); return; }
    i = best;
  }
  svg.querySelectorAll('.pt').forEach(p => p.classList.toggle('on', +p.dataset.i === i));
  const pt = svg.querySelector(`.pt[data-i="${i}"]`);
  const cur = svg.querySelector('.cursor');
  if (pt && cur) { cur.setAttribute('x1', pt.getAttribute('cx')); cur.setAttribute('x2', pt.getAttribute('cx')); cur.classList.add('on'); }
  if (pt) {
    const pr = pt.getBoundingClientRect();
    tt.innerHTML = `${esc(tipLabels[i] || MONTHS_BACK[i] || '')} · <span class="tt-v">${money ? fmt.money(vals[i]) : fmt.num(vals[i])}</span>`;
    tt.style.left = (pr.left + pr.width / 2) + 'px';
    tt.style.top = pr.top + 'px';
    tt.hidden = false;
    clampTip(tt);
  }
});
/* Keep the tooltip inside the viewport. It is position:fixed + nowrap; on iOS a
   tap fires pointerover, and a fixed element hanging past the right edge makes
   the whole page pannable sideways — the "tab isn't responsive" bug. */
function clampTip(tt) {

  tt.style.left = clamp(parseFloat(tt.style.left), half, window.innerWidth - half) + 'px';
}
function hideTip() {

  document.querySelectorAll('.spark .cursor.on').forEach(c => c.classList.remove('on'));
}
document.addEventListener('pointerleave', e => {

/* Generic per-mark hover tooltip for [data-tt] elements (bar chart rows, etc.) */
document.addEventListener('pointerover', e => {
  const t = e.target.closest && e.target.closest('[data-tt]');
  if (!t) {

    // tapping anywhere else must put the tooltip away
    const tt = tooltipEl();

function attachPostImg(file, idx) {
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    im.onload = () => {
      const S = 240;
      const c = document.createElement('canvas');
      c.width = S; c.height = S;
      const side = Math.min(im.width, im.height);
      c.getContext('2d').drawImage(im, (im.width - side) / 2, (im.height - side) / 2, side, side, 0, 0, S, S);
      setPath(`posts.${idx}.img`, c.toDataURL('image/jpeg', 0.72));
      save(true);
      render();
      toast('✓ Photo added — stored only on this device');
    };
    im.onerror = () => toast('Couldn’t read that image — try a JPG or PNG');
    im.src = reader.result;
  };
  reader.onerror = () => toast('Couldn’t read that file');
  reader.readAsDataURL(file);
}

/* 3 · Engagement funnel — tapering steps + conversion connectors, weakest leak flagged */
function funnelHTML(r) {
  const steps = r.funnel;
  if (steps.every(s => num(s.v) === null)) return `<div class="emptystate">Log reach, profile visits, follows and link clicks on your posts — the funnel builds itself and shows where growth leaks.</div>`;
  const base = num(steps[0].v);
  const convs = [];
  let weakest = -1, weakestConv = Infinity;
  for (let i = 0; i < steps.length - 1; i++) {
    const c = div(steps[i + 1].v, steps[i].v);
    convs.push(c === null ? null : c * 100);
    if (c !== null && c * 100 < weakestConv) { weakestConv = c * 100; weakest = i; }
  }
  return `<div class="funnel">${steps.map((s, i) => {
    // sqrt scale keeps the taper visible even when lower steps are <2% of reach
    const w = base ? clamp(Math.sqrt((num(s.v) ?? 0) / base) * 100, 4, 100) : 100;
    let conn = '';
    if (i < steps.length - 1) {
      const c = convs[i];
      const lost = (num(steps[i].v) !== null && num(steps[i + 1].v) !== null) ? num(steps[i].v) - num(steps[i + 1].v) : null;
      if (c === null) conn = `<div class="fconn">↓ <span class="hint-edit">no data yet</span></div>`;
      else if (c > 100) conn = `<div class="fconn">↓ <b>${fmt.int(steps[i + 1].v)}</b> clicked — more than new follows; existing followers click too</div>`;
      else conn = `<div class="fconn${i === weakest ? ' fc-weak' : ''}">↓ <b>${fmt.pct(c, c < 1 ? 2 : 1)}</b> continue${lost !== null ? ` · ${fmt.int(lost)} drop off` : ''}${i === weakest ? ' · biggest leak' : ''}</div>`;
    }
    return `<div class="fstep fs-${i}" style="--w:${w.toFixed(1)}%;animation-delay:${(i * 0.1).toFixed(1)}s"><b>${fmt.int(s.v)}</b>${s.label}</div>${conn}`;
  }).join('')}</div>`;
}

/* 4 · Best-time-to-post heatmap — quintile ramp over the user's own average ER */
function heatmapHTML(cells) {
  const flat = [];
  cells.forEach(row => row.forEach(c => { if (c.er !== null) flat.push(c.er); }));
  if (!flat.length) return `<div class="emptystate">Add posting times to your logged posts — the heatmap finds your best windows from your own results, not someone else's "best time to post".</div>`;
  const sorted = flat.slice().sort((a, b) => a - b);
  const q = f => sorted[Math.min(sorted.length - 1, Math.floor(f * sorted.length))];
  const th = [q(.2), q(.4), q(.6), q(.8)];
  let best = null;
  cells.forEach((row, dw) => row.forEach((c, tb) => {
    if (c.er !== null && c.n >= 2 && (!best || c.er > best.er)) best = {dw, tb, er: c.er};
  }));
  let html = `<div class="heatmap" role="img" aria-label="Average engagement rate by weekday and time of day, from your own posts">
    <span></span>${TIME_BUCKETS.map(t => `<span class="hm-col">${t}</span>`).join('')}`;
  cells.forEach((row, dw) => {
    html += `<span class="hm-lab">${DOWS[dw]}</span>` + row.map((c, tb) => {
      if (!c.n || c.er === null) return `<span class="hm-cell hollow" data-tt="${DOWS[dw]} ${TIME_BUCKETS[tb]} — no posts yet"></span>`;
      const lvl = c.er >= th[3] ? 4 : c.er >= th[2] ? 3 : c.er >= th[1] ? 2 : c.er >= th[0] ? 1 : 0;
      const isBest = best && best.dw === dw && best.tb === tb;
      return `<span class="hm-cell h${lvl}${isBest ? ' hm-best' : ''}" data-tt="${DOWS[dw]} ${TIME_BUCKETS[tb]} — ${c.n} post${c.n === 1 ? '' : 's'} · ${fmt.pct(c.er)} avg ER${isBest ? ' · your best window' : ''}"></span>`;
    }).join('');
  });
  html += `</div><div class="hm-legend">less <i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i> more engagement · ★ = best window (2+ posts)</div>`;
  return html;
}

/* 9 · Trend expiry countdown chip */
function expiryChip(expires) {
  const du = daysUntil(expires);
  if (du === null) return staticChip('neutral', 'clock', 'no expiry');
  if (du < 0) return staticChip('neutral', 'x', 'Expired');
  if (du <= 2) return staticChip('serious', 'clock', du === 0 ? 'Last day' : `${du}d left`);
  if (du <= 7) return staticChip('warning', 'clock', `${du}d left`);
  return staticChip('good', 'clock', `${du}d left`);
}

/* 11 · Follower series + milestone marks for the growth chart */
function followerSeries(d, pid, endKey) {
  const k12 = Array.from({length: 12}, (_, i) => addMonths(endKey, i - 11));
  return {
    k12,
    labels: k12.map(k => refDate(k).toLocaleDateString('en-US', {month: 'short'})),
    series: k12.map(k => followersAt(d, k, pid)),
    marks: (d.milestones || []).filter(m => m.date && m.label)
      .map(m => ({i: k12.indexOf(String(m.date).slice(0, 7)), label: `${m.label} · ${fmtDate(m.date)}`}))
      .filter(m => m.i >= 0),

/* Rule-based insight callouts — reads the tags (format/pillar/time) against results */
function insightCallouts(d, keys, pid) {
  const out = [];
  const r = derive(d, keys, pid);
  const b = d.benchmarks;
  const fmts = deriveFormats(d, keys, pid).filter(f => f.n >= 3 && f.er !== null);
  if (fmts.length >= 2 && fmts[0].index >= 115) {
    const meta = FORMATS[fmts[0].format];
    out.push(`<strong>${esc(meta.label)}s</strong> earn ${fmt.num(fmts[0].index / 100, 1)}× your average engagement but are ${fmt.num(fmts[0].share, 0)}% of your output — shift the mix toward them.`);
  }
  if (fmts.length >= 2) {
    const worst = fmts[fmts.length - 1];
    if (worst.index !== null && worst.index <= 80 && worst.share >= 20) out.push(`<strong>${esc(FORMATS[worst.format].label)}s</strong> underperform (${fmt.num(worst.index, 0)} index) yet take ${fmt.num(worst.share, 0)}% of your effort — repurpose that time.`);
  }
  const cells = deriveHeat(d, keys, pid);
  let best = null;
  cells.forEach((row, dw) => row.forEach((c, tb) => { if (c.er !== null && c.n >= 2 && (!best || c.er > best.er)) best = {dw, tb, er: c.er}; }));
  if (best) out.push(`Your best window is <strong>${DOWS[best.dw]} ${TIME_BUCKETS[best.tb]}</strong> (${fmt.pct(best.er)} avg ER) — schedule the posts that matter there.`);
  const pils = derivePillars(d, keys, pid).list.filter(pl => pl.n >= 2);
  if (pils.length >= 2) {
    const topSaves = pils.slice().sort((a, c) => c.saves - a.saves)[0];
    if (topSaves && topSaves.saves > 0) out.push(`<strong>“${esc(topSaves.name)}”</strong> posts get saved most (${fmt.int(topSaves.saves)} saves) — saves are the algorithm's favorite signal, make more of these.`);
  }
  if (r.watchAvg !== null && num(b.watchPct) !== null && r.watchAvg < num(b.watchPct)) {
    out.push(`Average watch-through is <strong>${fmt.pct(r.watchAvg, 0)}</strong> vs your ${fmt.pct(b.watchPct, 0)} target — tighten the first 3 seconds.`);
  }
  if (r.followConv !== null && num(b.followConv) !== null && r.followConv < num(b.followConv)) {
    out.push(`Only <strong>${fmt.pct(r.followConv, 2)}</strong> of reach converts to follows (target ${fmt.pct(b.followConv, 2)}) — your profile is leaking; check bio, pinned posts and grid.`);
  }
  return out.slice(0, 5);
}

  return `

            <td>${!p.active ? '<span class="dash">—</span>' : gap === null ? staticChip('neutral', 'question', 'No posts yet') : gap > staleAfter ? staticChip('warning', 'clock', gap + 'd ago') : staticChip('good', 'checkcircle', gap === 0 ? 'Today' : gap + 'd ago')}</td>
            <td><input type="checkbox" data-checkpath="platforms.${i}.active" ${p.active ? 'checked' : ''} aria-label="Platform active"></td>
            <td><button class="rowedit" data-action="editrow" data-list="platforms" data-i="${i}" aria-label="Edit this row">${icon('sliders', 13)}</button><button class="rowdel" data-action="delrow" data-list="platforms" data-i="${i}" aria-label="Delete platform">${icon('x', 13)}</button></td>
          </tr>`; }).join('')}</tbody></table></div></div>
    </section>

      </section>`; }).join('')}

      ${cardH('info', 'Why Cadence Matters', '', 'golden')}

function viewCalendar() {
  const d = D();
  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + ui.monthOffset);
  const y = base.getFullYear(), mo = base.getMonth();
  const first = new Date(y, mo, 1), startDow = (first.getDay() + 6) % 7; // Monday start
  const dim = new Date(y, mo + 1, 0).getDate();
  const byDate = {};
  (d.posts || []).forEach(p => {
    if (!p.date) return;
    const kind = p.status === 'posted' ? 'posted' : p.status === 'scheduled' ? 'sched' : 'pipe';
    (byDate[p.date] = byDate[p.date] || []).push({title: p.title || 'Untitled', kind, pid: p.pid, id: p.id});
  });
  (d.deals || []).forEach((dl, di) => {
    if (dl.due && !['paid'].includes(dl.status)) (byDate[dl.due] = byDate[dl.due] || []).push({title: `Due: ${dl.brand || 'deal'}`, kind: 'deal', list: 'deals', i: di});
  });
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push(null);
  for (let day = 1; day <= dim; day++) cells.push(day);
  while (cells.length % 7) cells.push(null);
  const tISO = localISO(new Date());
  const evStyle = {posted: '', sched: 'style="background:var(--teal-soft);color:var(--teal-deep)"', pipe: 'style="background:var(--golden-soft);color:var(--golden-deep)"', deal: 'style="background:var(--info-soft);color:var(--info-deep)"'};
  const stages = CYCLE_SETS.pipeline.values;
  const stageMeta = CYCLE_SETS.pipeline.meta;
  const pipeItems = stage => (d.posts || []).map((p, i) => ({p, i})).filter(x => x.p.status === stage)
    .sort((a, c) => String(a.p.date || '9999').localeCompare(String(c.p.date || '9999')));
  return `

          ${DOWS.map(dw => `<div class="dow">${dw}</div>`).join('')}
          ${cells.map(day => {
            if (day === null) return `<div class="day out" aria-hidden="true"></div>`;
            const iso = `${y}-${String(mo + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const dayEvs = byDate[iso] || [];
            const busy = dayEvs.length > 2;
            return `<div class="day ${iso === tISO ? 'today' : ''}" data-action="daypeek" data-date="${iso}" role="button" tabindex="0" aria-label="${fmtDate(iso, {month: 'long', day: 'numeric'})}: ${dayEvs.length ? dayEvs.map(e => e.title).join('; ') : 'no items'}${busy ? '. Busy day' : ''}. Click to open this day">
              <span class="dnum">${day}</span>
              ${busy ? `<span class="busy" title="3+ items — consider spacing posts">busy</span>` : ''}
              ${dayEvs.slice(0, 3).map(e => `<span class="ev" ${evStyle[e.kind] || ''}${e.id ? ` data-action="editpost" data-id="${e.id}" title="Click to edit"` : e.list ? ` data-action="editrow" data-list="${e.list}" data-i="${e.i}" title="Click to edit"` : ''}>${esc(e.title)}</span>`).join('')}

            </div>`; }).join('')}
        </div>

          <span><span class="sw" style="background:var(--coral-soft);border:1px solid var(--coral)"></span>Posted</span>
          <span><span class="sw" style="background:var(--teal-soft);border:1px solid var(--teal)"></span>Scheduled</span>

/* ================================================================
   ANALYZE — Engagement Funnel & Growth
================================================================ */
function viewFunnel() {
  const d = D(), b = d.benchmarks;
  const pid = ui.platform;
  const pKeys = periodMonthsKeys();
  const r = derive(d, pKeys, pid);
  const fs = followerSeries(d, pid, pKeys[pKeys.length - 1]);
  const netByMonth = fs.k12.map((k, i) => {
    const now = followersAt(d, k, pid), prev = followersAt(d, addMonths(k, -1), pid);
    return (now !== null && prev !== null) ? now - prev : null;
  });
  const drivers = (d.posts || []).filter(p => p.status === 'posted' && p.date && pKeys.includes(p.date.slice(0, 7)) && (pid === 'all' || p.pid === pid) && num(p.follows))
    .sort((a, c) => num(c.follows) - num(a.follows)).slice(0, 5);
  const weakLabel = (() => {
    const f = r.funnel;
    let worst = null, worstC = Infinity;
    for (let i = 0; i < f.length - 1; i++) {
      const c = div(f[i + 1].v, f[i].v);
      if (c !== null && c < worstC) { worstC = c; worst = i; }
    }
    if (worst === null) return '';
    const fixes = [
      'reach → visits leaks: your content works but doesn’t make people curious about <em>you</em> — strengthen hooks that reference your story and pin your best converter.',
      'visits → follows leaks: people check the profile and bounce — tighten the bio promise, pinned posts and grid cohesion (see the feed preview).',
      'follows → clicks leaks: followers aren’t taking the next step — make the link-in-bio offer match what they followed for, and actually ask (CTA bank).',
    ];
    return `<p class="risknote" style="text-align:left;padding:0"><strong>Biggest leak: ${f[worst].label.toLowerCase()} → ${f[worst + 1].label.toLowerCase()}.</strong> ${fixes[worst]}</p>`;
  })();
  return `
  ${viewHead('Engagement Funnel & Growth', 'The diagnostic view — where attention leaks before it becomes followers and clicks.')}
  ${periodBar()}
  ${platformPills(d)}
  <div class="grid">
    <section class="card c7" aria-label="Engagement funnel">
      ${cardH('funnel', 'Reach → Visits → Follows → Clicks', periodLabel(), 'coral')}
      <div class="card-b">
        ${funnelHTML(r)}
        ${weakLabel}
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          ${r.visitRate !== null ? staticChip(num(b.visitRate) !== null && r.visitRate >= num(b.visitRate) ? 'good' : 'warning', 'eye', `visit rate ${fmt.pct(r.visitRate, 2)} (target ${fmt.pct(b.visitRate)})`) : ''}
          ${r.followConv !== null ? staticChip(num(b.followConv) !== null && r.followConv >= num(b.followConv) ? 'good' : 'warning', 'usersplus', `follow conv ${fmt.pct(r.followConv, 2)} (target ${fmt.pct(b.followConv, 2)})`) : ''}
          ${r.linkCtr !== null ? staticChip(num(b.linkCtr) !== null && r.linkCtr >= num(b.linkCtr) ? 'good' : 'warning', 'link', `link CTR ${fmt.pct(r.linkCtr, 2)} (target ${fmt.pct(b.linkCtr, 2)})`) : ''}
        </div>
      </div>
    </section>
    <section class="card c5" aria-label="Growth drivers">
      ${cardH('usersplus', 'Growth Drivers', 'posts that earned the most follows', 'aqua')}
      ${drivers.length ? `<ul class="plainlist">${drivers.map(p => `
        <li class="rowlink" data-action="editpost" data-id="${p.id}" role="button" tabindex="0" title="Click to open this post">${thumbTile(d, p, {size: 'md'})}<span class="li-main" style="margin-left:4px">${esc(p.title || 'Untitled')}
          <div class="li-sub">${esc((PLATFORM_META[p.pid] || {label: p.pid}).label)} · reach ${fmt.int(p.reach)} · ${fmtDate(p.date)}</div></span>
        <strong style="white-space:nowrap">+${fmt.int(p.follows)}</strong></li>`).join('')}</ul>
        <p class="hint-edit" style="margin:0;padding:10px 16px">Study what these share — hook, format, pillar — and make more of it.</p>`
      : `<div class="emptystate">Log “follows from post” on your posts (most platform insights show it) — your growth drivers surface here.</div>`}
    </section>
    <section class="card c8" aria-label="Follower growth chart">
      ${cardH('spark', 'Follower Growth — With Your Milestones', 'flags mark the moments that mattered', 'golden')}
      <div class="card-b">${sparkSVG(fs.series, {id: 'funspark', money: false, labels: fs.labels, zeroBase: false, marks: fs.marks})}</div>
    </section>
    <section class="card c4" aria-label="Milestones">
      ${cardH('star', 'Milestones', 'shown as ⚑ on growth charts', 'golden')}
      <div class="card-b flush">
        ${(d.milestones || []).length ? `<ul class="plainlist">${(d.milestones || []).map((mm, i) => `
          <li><span style="min-width:0;flex:1">${edField(`milestones.${i}.date`, {type: 'date', min: 10, label: 'Milestone date'})} ${edField(`milestones.${i}.label`, {min: 18, max: 30, label: 'Milestone label', ph: 'what happened?'})}</span>
          <button class="rowedit" data-action="editrow" data-list="milestones" data-i="${i}" aria-label="Edit this row">${icon('sliders', 13)}</button><button class="rowdel" data-action="delrow" data-list="milestones" data-i="${i}" aria-label="Delete milestone">${icon('x', 13)}</button></li>`).join('')}</ul>` : `<div class="emptystate">Mark launches, viral posts, follower round numbers…</div>`}
        <button class="addrow" style="margin-left:12px" data-action="addrow" data-list="milestones">${icon('plus', 13)}Add milestone</button>
      </div>
      <div class="card-b" style="border-top:1px solid var(--hairline)">
        <div class="t-label" style="margin-bottom:6px">Net new followers · by month</div>
        ${miniBarsSVG(netByMonth, {labels: fs.labels, fmtV: v => (v > 0 ? '+' : '') + fmt.int(v) + ' followers'}) || '<span class="hint-edit">needs 2+ monthly snapshots</span>'}
      </div>
    </section>
  </div>`;
}

/* Compose a starting narrative from this period's actual numbers — computed locally
   from derive(), nothing uploaded. The user edits it like any typed note. */
function draftReportNotes(d, r) {
  const b = d.benchmarks;
  const S = [];
  if (r.health !== null) {
    const band = healthBand(r.health);
    S.push(`Program health is ${r.health}/100 — ${band.label.toLowerCase()}${r.weakest && r.weakest.v < 85 ? `, with ${r.weakest.name.toLowerCase()} the main drag at ${r.weakest.v}` : ''}.`);
  }
  if (r.netFollowers !== null) S.push(`Followers ${r.netFollowers >= 0 ? 'grew' : 'fell'} ${r.netFollowers >= 0 ? '+' : ''}${fmt.int(r.netFollowers)} (${fmt.signed(r.growthPct)}) to ${fmt.int(r.followersNow)}.`);
  if (r.erReach !== null) S.push(`Engagement rate ${num(b.er) !== null ? `${r.erReach >= num(b.er) ? 'held above' : 'slipped below'} the ${fmt.pct(b.er)} benchmark at ` : 'was '}${fmt.pct(r.erReach)}${r.saveRate !== null ? `, with saves at ${fmt.pct(r.saveRate, 2)} of reach` : ''}.`);
  const keys = periodMonthsKeys();
  const top = (d.posts || []).filter(p => p.status === 'posted' && p.date && keys.includes(p.date.slice(0, 7)) && div(postInteractions(p), p.reach) !== null)
    .sort((a, c) => div(postInteractions(c), c.reach) - div(postInteractions(a), a.reach))[0];
  if (top) S.push(`Best post: “${top.title}” (${(PLATFORM_META[top.pid] || {label: top.pid}).label} ${(FORMATS[top.format] || {label: ''}).label.toLowerCase()}, ${fmt.pct(div(postInteractions(top), top.reach) * 100)} ER${num(top.follows) ? `, +${fmt.int(top.follows)} follows` : ''}).`);
  if (r.nPosts >= 8) {
    const drift = derivePillars(d, keys, 'all').list
      .filter(pl => pl.target !== null && pl.actualPct !== null)
      .map(pl => ({pl, diff: pl.actualPct - pl.target}))
      .sort((a, c) => Math.abs(c.diff) - Math.abs(a.diff))[0];
    if (drift && Math.abs(drift.diff) > 10) S.push(`Content mix drifted ${drift.diff > 0 ? 'over' : 'under'} on “${drift.pl.name}” (${fmt.num(drift.pl.actualPct, 0)}% of posts vs ${fmt.num(drift.pl.target, 0)}% planned) — rebalance next period.`);
  }
  if (r.cadenceTarget) S.push(`Publishing: ${r.cadenceActual} of ~${r.cadenceTarget} planned posts${r.consistencyPct !== null && r.consistencyPct < 85 ? ' — tightening the cadence is the quickest win' : ''}.`);
  const goal = num(d.money && d.money.incomeGoal);
  if (r.monetizeRev !== null || goal) S.push(`Monetization came to ${fmt.money(r.monetizeRev)}${goal ? ` (${fmt.pct(div(r.monetizeRev, goal * r.monthCount) * 100 || 0, 0)} of the ${fmt.money(goal * r.monthCount)} goal)` : ''}${r.adSpend ? `; net ${fmt.money(r.netMonetize)} after ${fmt.money(r.adSpend)} in ads and boosts` : ''}.`);
  return S.join(' ');
}

let renderTimer = null;
function scheduleRender() {
  clearTimeout(renderTimer);

    const ae = document.activeElement;

    // <select>, iOS ties the open picker to that exact element — swapping it out
    // mid-pick makes the change event fire on a detached node and the choice is
    // silently lost (tap-twice-to-stick). Hold the render until the select settles.
    if (ae && ae.tagName === 'SELECT' && ae.closest('#main')) {
      const resume = () => { ae.removeEventListener('change', resume); ae.removeEventListener('blur', resume); scheduleRender(); };
      ae.addEventListener('change', resume);
      ae.addEventListener('blur', resume);
      return;
    }
    const path = ae && ae.classList && ae.classList.contains('ed') ? ae.dataset.path : null;
    // the same post card can exist in the grid AND the editor modal — refocus in the
    // container the user was actually typing in
    const wasInModal = ae && ae.closest && !!ae.closest('.pmodal');
    render();
    if (path) {
      const scope = (wasInModal && document.querySelector('.pmodal')) || document;
      const el = scope.querySelector(`.ed[data-path="${CSS.escape(path)}"]`);
      if (el) { el.focus(); if (el.select) el.select(); }
    }
  }, 40);
}

function addModalHTML() {

  // fresh each render, every field pre-fills, and the footer gains Delete.
  const {list, i} = ui.addModal;

  const row = editMode ? listRef(list)[i] : ui.addModal.row;

document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const act = btn.dataset.action;
  if (act === 'sample-clear') {
    if (!confirm('Clear the sample data?\n\nThis removes only the example rows that came with the file. Anything you have typed yourself — your brand details, your platforms, your own posts — is kept exactly as it is.')) return;
    clearSampleData(state.data);
    state.meta.sample = 'cleared';
    save();
    render();
    toast('✓ Sample data cleared — the file is yours now');
    return;
  }
  if (act === 'sample-keep') {
    state.meta.sample = 'kept';
    save();
    render();
    toast('✓ Kept — you can clear it later from Start Here');
    return;
  }
  if (act === 'nav' || act === 'goto') {
    if (ui.editPost && !cancelPostEdit()) return; // unsaved draft — user kept editing
    ui.view = btn.dataset.view;
    ui.monthOffset = 0;
    ui.editPost = null;
    ui.addModal = null;
    ui.dayPeek = null;
    document.body.classList.remove('nav-open');
    try { history.replaceState(null, '', '#' + ui.view); } catch (err) {}
    animPending = true;
    render();
    $('#main').focus({preventScroll: true});
    window.scrollTo({top: 0});
  } else if (act === 'menu') {
    document.body.classList.toggle('nav-open');
    btn.setAttribute('aria-expanded', document.body.classList.contains('nav-open'));
  } else if (act === 'platfilter') {
    ui.platform = btn.dataset.pid;
    render();
  } else if (act === 'editpost') {
    // ignore clicks that were really aimed at a control inside the card
    if (e.target.closest('select, .chipsel, .rowdel, .rowedit, .th-add, input, a')) return;
    openPostEditor(btn.dataset.id);
    render();
  } else if (act === 'editclose') {
    if (!cancelPostEdit()) return; // user chose to keep editing
    render();
  } else if (act === 'editsave') {
    ui.postsSnapshot = null;
    ui.editPost = null;
    save(true);
    render();
    toast('✓ Saved');
  } else if (act === 'daypeek') {
    ui.dayPeek = btn.dataset.date;
    render();
  } else if (act === 'daypeekclose') {
    ui.dayPeek = null;
    render();
  } else if (act === 'pillarcolor') {
    const i = parseInt(btn.dataset.i, 10);
    const pl = D().pillars[i];
    if (pl) { pl.color = ((pl.color ?? 0) + 1) % 6; save(true); render(); }
  } else if (act === 'pmode') {
    ui.period.mode = btn.dataset.mode;
    render();
  } else if (act === 'pshift') {
    const dir = parseInt(btn.dataset.dir, 10);
    if (dir === 0) ui.period.ref = monthKey();
    else {
      const step = ui.period.mode === 'month' ? 1 : ui.period.mode === 'quarter' ? 3 : 12;
      ui.period.ref = addMonths(ui.period.ref, dir * step);
    }
    render();
  } else if (act === 'theme') {
    state.meta.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    save(false);
    applyTheme();
    render();
  } else if (act === 'palette') {
    state.meta.palette = (btn.dataset.palette || (state.meta.palette === 'blush' ? 'clearly' : 'blush'));
    save(false);
    applyPalette();
    render();

  else if (act === 'nudge-dismiss') { state.meta.nudgeSnoozed = new Date().toISOString(); save(false); render(); }

  else if (act === 'crosspost') {

    if (first && window.matchMedia('(hover:hover) and (pointer:fine)').matches) first.focus();
  } else if (act === 'editdel') {
    const {list, i} = ui.addModal;
    const arr = listRef(list);
    const label = arr[i] && (arr[i].title || arr[i].name || arr[i].brand || arr[i].text || arr[i].idea || arr[i].label || arr[i].handle) || 'this row';
    if (!confirm(`Delete “${String(label).slice(0, 60)}”?`)) return;
    arr.splice(i, 1);
    ui.addModal = null;
    save(true); render();
    toast('✓ Deleted');
  } else if (act === 'addsave') {
    const {list, i} = ui.addModal;
    const editMode = i !== undefined;
    const row = editMode ? listRef(list)[i] : ui.addModal.row;
    document.querySelectorAll('.pmodal [data-fkey]').forEach(inp => {
      const k = inp.dataset.fkey;
      const v = String(inp.value ?? '').trim();
      // adding keeps the seed when a field is left blank; editing lets you clear it
      if (inp.dataset.ftype === 'num') { if (v !== '') row[k] = num(v); else if (editMode) row[k] = null; }
      else if (v !== '' || editMode) row[k] = v;
    });
    if (!editMode) listRef(list).push(row);
    ui.addModal = null;
    save(true); render();
    toast(editMode ? '✓ Saved' : '✓ Added — tap any of its fields to edit it later');
  } else if (act === 'delrow') {
    const list = btn.dataset.list, i = parseInt(btn.dataset.i, 10);
    const arr = listRef(list);
    const label = arr[i] && (arr[i].title || arr[i].name || arr[i].brand || arr[i].text || arr[i].idea || arr[i].label || arr[i].handle) || 'this row';
    if (!confirm(`Delete “${String(label).slice(0, 60)}”?`)) return;
    const gone = arr.splice(i, 1)[0];
    // deleting the post that's open in the editor is an explicit, confirmed act —
    // keep the deletion, drop the draft snapshot so Cancel can't resurrect it
    if (list === 'posts' && gone && gone.id === ui.editPost) { ui.editPost = null; ui.postsSnapshot = null; }
    save(true); render();
  }
});
$('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
$('#restoreFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) doRestore(f);
  e.target.value = '';
});
let imgTargetIdx = null;
$('#postImgFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f && imgTargetIdx !== null && D().posts[imgTargetIdx]) attachPostImg(f, imgTargetIdx);
  imgTargetIdx = null;
  e.target.value = '';
});

/* Editable field lifecycle */
document.addEventListener('focusin', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('ed')) el.dataset.orig = el.value;
});
document.addEventListener('keydown', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('ed')) {
    if (e.key === 'Escape' && document.body.classList.contains('nav-open')) document.body.classList.remove('nav-open');
    else if (e.key === 'Escape' && ui.addModal) { ui.addModal = null; render(); }
    else if (e.key === 'Escape' && ui.editPost) { if (cancelPostEdit()) render(); }
    else if (e.key === 'Escape' && ui.dayPeek) { ui.dayPeek = null; render(); }
    else if (e.key === 'Enter' && e.target.dataset && e.target.dataset.action === 'daypeek') { e.preventDefault(); e.target.click(); }
    else if (e.key === 'Enter' && ui.addModal && el.classList && el.classList.contains('af-in') && el.tagName === 'INPUT') {
      const saveBtn = document.querySelector('.pmodal [data-action="addsave"]');
      if (saveBtn) saveBtn.click();
    }
    return;
  }
  if (e.key === 'Enter' && el.tagName !== 'TEXTAREA') { e.preventDefault(); el.blur(); }
  else if (e.key === 'Escape') { el.dataset.skip = '1'; el.value = el.dataset.orig ?? ''; el.blur(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList && el.classList.contains('ed')) {
    if (el.tagName === 'INPUT') el.style.width = Math.min(Math.max(el.value.length, 2) + 1, 40) + 'ch';
    el.classList.toggle('ed-empty', el.value.trim() === '');
  }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (!el.classList || !el.classList.contains('ed')) return;
  if (el.dataset.skip) { delete el.dataset.skip; el.value = el.dataset.orig ?? ''; el.classList.toggle('ed-empty', el.value.trim() === ''); return; }
  if (el.value === el.dataset.orig) return;
  let v = el.value.trim();
  if (el.dataset.etype === 'num') v = v === '' ? null : num(v);
  setPath(el.dataset.path, v);
  save(true);
  scheduleRender();
});
/* Checkboxes, filters & status dropdowns */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset && el.dataset.checkpath) {
    setPath(el.dataset.checkpath, el.checked);
    save(true);
    scheduleRender();
  } else if (el.dataset && el.dataset.action === 'filter-posts') {
    ui.filterPosts = el.value;
    render();
  } else if (el.dataset && el.dataset.action === 'sort-posts') {
    ui.postSort = el.value;
    render();
  } else if (el.classList && el.classList.contains('statussel')) {
    const path = el.dataset.path;
    const wasInModal = el.closest && !!el.closest('.pmodal');
    setPath(path, el.value);
    save(true);
    render();
    // Keyboard users get their focus back after the re-render; on touch devices
    // refocusing a <select> makes iOS treat the NEXT tap as "dismiss the focused
    // picker" — every control then needs two taps — so only refocus with a pointer.
    if (window.matchMedia('(hover:hover) and (pointer:fine)').matches) {
      const scope = (wasInModal && document.querySelector('.pmodal')) || document;
      const again = scope.querySelector(`select.statussel[data-path="${CSS.escape(path)}"]`);
      if (again) again.focus();
    }
  }
});

/* Init — brand fonts are embedded in the stylesheet, so no network is ever needed */
render();
window.addEventListener('hashchange', () => {
  const h = location.hash.replace('#', '');
  if (VIEWS.some(v => v.id === h) && h !== ui.view) {
    if (ui.editPost && !cancelPostEdit()) { try { history.replaceState(null, '', '#' + ui.view); } catch (err) {} return; }
    ui.dayPeek = null;
    ui.view = h; animPending = true; render();
  }
});
</script>
</body>
</html>
